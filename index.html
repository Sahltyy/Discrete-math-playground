  id: 'ind', num: '5.2', name: 'Mathematical Induction', short: 'Induction', lab: 'ind',
  blurb: 'Dominoes: a basis step plus an inductive step. P(1), P(k), P(k + 1), full proofs, and two sum shortcuts.',
  keys: ['Induction = basis step + inductive step. First domino falls, and each one knocks over the next.', 'Basis step: plug the starting value into BOTH sides and show they match.', 'P(k + 1): replace every n with (k + 1), with parentheses, then clean up.', 'Inductive hypothesis: suppose P(k) for an integer k ≥ a. Never assume P(k + 1).', 'Left side of P(k + 1) = left side of P(k) + next term → use the IH → algebra → right side of P(k + 1).', 'Factor out (k + 1) instead of expanding everything.', '1 + 2 + ⋯ + n = n(n + 1)/2.', '1 + r + r² + ⋯ + rⁿ = (rⁿ⁺¹ − 1)/(r − 1), for r ≠ 1.'],
  cards: [
    { t: 'Induction is dominoes', b: '<p>You want to prove something is true for <b>every</b> integer n ≥ 1. That is infinitely many cases, so you can’t check them one by one. You prove two things instead:</p><p><b>1. Basis step:</b> the first domino falls. (It’s true for n = 1.)<br><b>2. Inductive step:</b> IF any domino k falls, THEN the next one, k + 1, falls too.</p><p>Together: 1 falls, so 2 falls, so 3 falls, and so on forever.</p>', fig: { html: DOMINO_FIG },
      think: 'You never prove “it’s true for k.” You SUPPOSE it’s true for k and use that to get k + 1. That suppose is allowed. It is the whole trick.',
      q: { q: 'The basis step shows:', o: ['The statement is true for the first value, like n = 1', 'The statement is true for every n', 'If P(k) is true then P(k + 1) is true', 'The statement is true for n = k'], w: 'Basis = the first domino.' } },
    { t: 'P(n) is a sentence with a blank', b: '<p>P(n) is the statement with n as a blank. To write P(1), P(k) or P(k + 1), you <b>replace every n</b> with that thing.</p>',
      ex: 'P(n): 1 + 3 + 5 + ⋯ + (2n − 1) = n²<br><br>P(1): the left side stops at 2(1) − 1 = 1, so P(1) is just 1 = 1². True ✓<br><br>P(k): 1 + 3 + 5 + ⋯ + (2k − 1) = k²<br><br>P(k + 1): 1 + 3 + 5 + ⋯ + (2(k + 1) − 1) = (k + 1)²<br>Clean up the last term: 2(k + 1) − 1 = 2k + 2 − 1 = 2k + 1<br>So P(k + 1): 1 + 3 + 5 + ⋯ + (2k + 1) = (k + 1)²',
      trap: 'Replace n EVERYWHERE, including the last term on the left. Use parentheses: n² becomes (k + 1)², not k + 1².',
      q: { q: 'P(n): 2 + 4 + ⋯ + 2n = n² + n. Which is P(k + 1)?', o: ['2 + 4 + ⋯ + 2(k + 1) = (k + 1)² + (k + 1)', '2 + 4 + ⋯ + 2k = k² + k', '2 + 4 + ⋯ + 2k + 1 = k² + k + 1', '2 + 4 + ⋯ + 2(k + 1) = k² + k'], w: 'Every n becomes (k + 1).' } },
    { t: 'Basis step: plug in the first value', b: '<p>Plug the starting value into the LEFT side and the RIGHT side separately. Show they are equal. Then say “so P(1) is true.”</p>',
      ex: 'P(n): 1 + 2 + ⋯ + n = n(n + 1)/2 for n ≥ 1<br>Left side when n = 1: just the first term, 1<br>Right side when n = 1: 1(1 + 1)/2 = 2/2 = 1<br>1 = 1, so P(1) is true ✓',
      trap: 'The start is not always 1. If it says n ≥ 0, plug in 0. If n ≥ 2, plug in 2. For 1 + 2 + 2² + ⋯ + 2ⁿ at n = 0, the left side is just 2⁰ = 1.',
      q: { q: 'P(n): 1 + 2 + 2² + ⋯ + 2ⁿ = 2ⁿ⁺¹ − 1 for n ≥ 0. What is the right side of P(0)?', o: ['1', '0', '2', '3'], w: '2⁰⁺¹ − 1 = 2 − 1 = 1.' } },
    { t: 'Inductive step: the 4 moves', b: '<p><b>Move 1.</b> Suppose P(k) is true for some integer k ≥ 1. Write it out. This is the <b>inductive hypothesis</b> (IH).</p><p><b>Move 2.</b> Write P(k + 1). This is your goal.</p><p><b>Move 3.</b> Start from the LEFT side of P(k + 1). Split off the last term. What’s left is exactly the left side of P(k).</p><p><b>Move 4.</b> Swap that part for the right side of P(k), using the IH. Do algebra until you reach the RIGHT side of P(k + 1).</p>',
      think: 'Move 3 is the “separate off the last term” skill from 5.1.',
      q: { q: 'In the inductive step, you replace part of the left side of P(k + 1) using:', o: ['the inductive hypothesis P(k)', 'the basis step', 'P(k + 1) itself', 'a guess'], w: 'That swap is the point of the IH.' } },
    { t: 'A full proof, every step shown', b: '<p><b>Theorem:</b> 1 + 2 + ⋯ + n = n(n + 1)/2 for every integer n ≥ 1.</p>',
      ex: '<b>Basis step:</b> n = 1. Left side = 1. Right side = 1(1 + 1)/2 = 1. Equal, so P(1) is true.<br><br><b>Inductive step:</b> Let k be any integer with k ≥ 1, and suppose<br>1 + 2 + ⋯ + k = k(k + 1)/2. ← IH<br>We must show 1 + 2 + ⋯ + (k + 1) = (k + 1)((k + 1) + 1)/2, which is (k + 1)(k + 2)/2.<br><br>Left side of P(k + 1):<br>1 + 2 + ⋯ + (k + 1)<br>= [1 + 2 + ⋯ + k] + (k + 1) ← split off the last term<br>= k(k + 1)/2 + (k + 1) ← by the IH<br>= k(k + 1)/2 + 2(k + 1)/2 ← same denominator<br>= (k + 1)(k + 2)/2 ← factor out (k + 1)<br>That is the right side of P(k + 1).<br><br>Since the basis step and the inductive step are both true, P(n) is true for every integer n ≥ 1. Q.E.D.',
      trap: 'Factor, don’t expand. You’re aiming for (k + 1)(k + 2)/2, so pull out (k + 1) and look at what’s left.',
      q: { q: 'k(k + 1)/2 + (k + 1) simplifies to:', o: ['(k + 1)(k + 2)/2', '(k + 1)²/2', 'k(k + 2)/2', '(k + 1)(k + 1)'], w: 'Pull out (k + 1): (k + 1)(k/2 + 1) = (k + 1)(k + 2)/2.' } },
    { t: 'Algebra trick: aim at the target', b: '<p>Before the algebra, write the right side of P(k + 1) as your target. Then steer toward that shape. Usually the move is: common denominator, then factor out (k + 1).</p>',
      ex: 'Target (k + 1)². After the IH you have k² + (2k + 1).<br>k² + 2k + 1 = (k + 1)(k + 1) = (k + 1)² ✓<br><br>Target 2ᵏ⁺² − 1. After the IH you have (2ᵏ⁺¹ − 1) + 2ᵏ⁺¹.<br>2ᵏ⁺¹ + 2ᵏ⁺¹ − 1 = 2 · 2ᵏ⁺¹ − 1 = 2ᵏ⁺² − 1 ✓',
      think: 'Two copies of the same power of 2 make the next power: 2ᵐ + 2ᵐ = 2ᵐ⁺¹.',
      q: { q: '3ᵏ + 2 · 3ᵏ = ?', o: ['3ᵏ⁺¹', '5ᵏ', '6ᵏ', '3²ᵏ'], w: '3ᵏ(1 + 2) = 3 · 3ᵏ = 3ᵏ⁺¹.' } },
    { t: 'The proof template', b: '<p>Copy this shape every time. Fill in the blanks.</p><div class="box ex tpl"><b>Proof (by mathematical induction):</b> Let P(n) be the equation ______.<br><br><b>Basis step:</b> When n = a, the left side is ___ and the right side is ___. They are equal, so P(a) is true.<br><br><b>Inductive step:</b> Let k be any integer with k ≥ a, and suppose ______. [inductive hypothesis] We must show ______.<br>The left side of P(k + 1) = [left side of P(k)] + next term = ___ by the inductive hypothesis = ___ = right side of P(k + 1).<br><br>Since the basis step and the inductive step are both true, P(n) is true for every integer n ≥ a. Q.E.D.</div>',
      think: 'Label the steps “Basis step” and “Inductive step.” Graders give points for each labeled piece even if one line of algebra slips.',
      q: { q: 'What does the last line of an induction proof say?', o: ['Since the basis and inductive steps are true, P(n) is true for every n ≥ a. Q.E.D.', 'So P(k + 1) = P(k).', 'So it works for n = 1, 2 and 3.', 'So k = n.'], w: 'Name both steps, then conclude for every n.' } },
    { t: 'Shortcut 1: adding 1 through n', b: '<p class="eq-big">1 + 2 + 3 + ⋯ + n = n(n + 1)/2</p><p>Use it to add long lists fast.</p>',
      ex: '4 + 8 + 12 + ⋯ + 200<br>= 4(1 + 2 + 3 + ⋯ + 50) ← pull out the 4 (200/4 = 50)<br>= 4 · 50(50 + 1)/2<br>= 4 · 50 · 51/2<br>= 4 · 1275<br>= 5100<br><br>3 + 4 + 5 + ⋯ + 1000<br>= (1 + 2 + ⋯ + 1000) − (1 + 2) ← fill in the missing start, then take it away<br>= 1000 · 1001/2 − 3<br>= 500500 − 3<br>= 500497',
      trap: 'Check where the list starts. If it doesn’t start at 1, add the missing front terms and subtract them.',
      q: { q: '1 + 2 + ⋯ + 20 = ?', o: ['210', '200', '420', '190'], w: '20 · 21/2 = 420/2 = 210.' } },
    { t: 'Shortcut 2: geometric sums', b: '<p class="eq-big">1 + r + r² + ⋯ + rⁿ = (rⁿ⁺¹ − 1)/(r − 1), for r ≠ 1</p>',
      ex: '1 + 2 + 2² + ⋯ + 2¹⁰ = (2¹¹ − 1)/(2 − 1) = 2047/1 = 2047<br><br>3 + 3² + ⋯ + 3ⁿ (no 1 in front!)<br>= (1 + 3 + 3² + ⋯ + 3ⁿ) − 1<br>= (3ⁿ⁺¹ − 1)/(3 − 1) − 1<br>= (3ⁿ⁺¹ − 1)/2 − 2/2<br>= (3ⁿ⁺¹ − 3)/2',
      trap: 'The power on top is n + 1, one MORE than the last exponent in the sum.',
      q: { q: '1 + 3 + 3² + 3³ = ?', o: ['40', '27', '80', '39'], w: '(3⁴ − 1)/(3 − 1) = 80/2 = 40. Check: 1 + 3 + 9 + 27 = 40 ✓' } },
    { t: 'Induction with a product', b: '<p>Same 4 moves. Split off the last <b>factor</b> instead of the last term, and replace the rest using the IH.</p>',
      ex: 'Theorem: (1 − 1/2)(1 − 1/3)⋯(1 − 1/n) = 1/n for n ≥ 2.<br>Basis: n = 2. Left = 1 − 1/2 = 1/2. Right = 1/2 ✓<br>IH: (1 − 1/2)⋯(1 − 1/k) = 1/k<br>Goal: (1 − 1/2)⋯(1 − 1/(k + 1)) = 1/(k + 1)<br>Left side = [(1 − 1/2)⋯(1 − 1/k)] · (1 − 1/(k + 1))<br>= (1/k) · (1 − 1/(k + 1)) ← IH<br>= (1/k) · ((k + 1)/(k + 1) − 1/(k + 1))<br>= (1/k) · (k/(k + 1))<br>= 1/(k + 1) ✓ Q.E.D.',
      q: { q: '1 − 1/(k + 1) = ?', o: ['k/(k + 1)', '1/k', '(k − 1)/(k + 1)', '−1/(k + 1)'], w: '(k + 1)/(k + 1) − 1/(k + 1) = k/(k + 1).' } },
    { t: 'Spot the broken proof', b: '<p>“Find the mistake” questions come up a lot. The usual three:</p><p><b>1. Wrong IH.</b> Writing just the last term (k² = …) instead of the whole sum (1² + 2² + ⋯ + k² = …).</p><p><b>2. Assuming the goal.</b> Writing P(k + 1) as if it’s already true and then “checking” it. You have to BUILD P(k + 1).</p><p><b>3. Half a basis step.</b> Checking only one side, or never saying “so P(1) is true.”</p>',
      q: { q: 'A proof begins its inductive step: “Suppose (k + 1)² = (k + 1)(k + 2)(2k + 3)/6.” What is wrong?', o: ['It assumes what must be proved, and the IH should be the whole sum up to k', 'Nothing', 'It should use n instead of k', 'The basis step needs a Q.E.D.'], w: 'Suppose P(k), the whole sum. Then derive P(k + 1).' } },
    { t: 'Guess the formula, then prove it', b: '<p>Some problems give a pattern and say “guess a formula and prove it.” Compute the first few values, spot the pattern, write it as P(n), then do a normal induction proof.</p>',
      ex: '(1 + 1/1)(1 + 1/2)⋯(1 + 1/n):<br>n = 1: 2<br>n = 2: 2 · 3/2 = 3<br>n = 3: 3 · 4/3 = 4<br>Guess: n + 1. Then prove (1 + 1/1)⋯(1 + 1/n) = n + 1 by induction.',
      q: { q: '1/(1 · 2) = 1/2. Adding 1/(2 · 3) gives 2/3. Adding 1/(3 · 4) gives 3/4. Guess for n terms?', o: ['n/(n + 1)', '1/(n + 1)', 'n/2', '(n + 1)/n'], w: 'Tops 1, 2, 3 → n. Bottoms 2, 3, 4 → n + 1.' } }
  ],
  items: [
    { type: 'mc', hw: '5.2 #2a', q: 'P(n): <m>1 + 4 + 7 + ⋯ + (3n − 2) = n(3n − 1)/2</m>. Write P(1). Is it true?', o: ['1 = 1(3 · 1 − 1)/2 = 1. True.', '1 + 4 = 1(3 − 1)/2. False.', '3 · 1 − 2 = 1(3 · 1 − 1). False.', 'P(1) can’t be checked.'], sol: 'For n = 1 the left side stops at 3(1) − 2 = 1, so it is just 1.<br>Right side: 1(3 · 1 − 1)/2 = 1 · 2/2 = 1.<br>1 = 1, so P(1) is true.' },
    { type: 'mc', hw: '5.2 #2b', q: 'Same P(n): <m>1 + 4 + 7 + ⋯ + (3n − 2) = n(3n − 1)/2</m>. Write P(k).', o: ['1 + 4 + 7 + ⋯ + (3k − 2) = k(3k − 1)/2', '3k − 2 = k(3k − 1)/2', '1 + 4 + 7 + ⋯ + (3n − 2) = k(3k − 1)/2', '1 + 4 + 7 + ⋯ + (3k − 2) = n(3n − 1)/2'], sol: 'Replace every n with k, on both sides. The left side is the WHOLE sum, not just the last term.' },
    { type: 'mc', hw: '5.2 #2c', q: 'Same P(n). Write P(k + 1), cleaned up.', o: ['1 + 4 + ⋯ + (3k + 1) = (k + 1)(3k + 2)/2', '1 + 4 + ⋯ + (3k − 1) = (k + 1)(3k + 2)/2', '1 + 4 + ⋯ + (3k + 1) = k(3k − 1)/2 + 1', '1 + 4 + ⋯ + (3k − 2) = (k + 1)(3k − 1)/2'], sol: 'Replace n with (k + 1).<br>Last term: 3(k + 1) − 2 = 3k + 3 − 2 = 3k + 1<br>Right side: (k + 1)(3(k + 1) − 1)/2 = (k + 1)(3k + 3 − 1)/2 = (k + 1)(3k + 2)/2' },
    { type: 'mc', hw: '5.2 #2d', q: 'In a proof by induction that P(n) holds for every integer n ≥ 1, what must the inductive step show?', o: ['For every integer k ≥ 1, if P(k) is true then P(k + 1) is true.', 'P(1) is true.', 'If P(k + 1) is true then P(k) is true.', 'P(n) is true for n = 1, 2 and 3.'], sol: 'The inductive step is the “each domino knocks over the next” part: P(k) → P(k + 1) for every k ≥ 1.' },
    { type: 'mc', hw: '5.2 #4', q: 'P(n): ' + SUM('i=1', 'n−1', 'i') + ' = (n − 1)n/2 for n ≥ 2. Write P(2). Is it true?', o: [SUM('i=1', '1', 'i') + ' = 1 and (2 − 1) · 2/2 = 1. True.', SUM('i=1', '2', 'i') + ' = 3 and 2 · 3/2 = 3. True.', '2 = 1. False.', 'P(2) is the same as P(1).'], sol: 'Plug in n = 2. The top becomes 2 − 1 = 1, so the sum has one term: i = 1 → 1.<br>Right side: (2 − 1) · 2/2 = 1 · 2/2 = 1.<br>1 = 1, so P(2) is true.' },
    { type: 'fill', hw: '5.2 #5', q: '<b>Fill in the proof:</b> 1 + 4 + 7 + ⋯ + (3n − 2) = n(3n − 1)/2 for every integer n ≥ 1.', parts: ['Basis step: When n = 1, the left side is 1 and the right side is 1(3 · 1 − 1)/2 = ', { num: 1 }, '. So P(1) is true. Inductive step: Let k be any integer with k ≥ 1, and suppose 1 + 4 + ⋯ + (3k − 2) = ', { alg: 'k(3k-1)/2', v: 'k' }, '. [This is the inductive hypothesis.] We must show 1 + 4 + ⋯ + (3(k + 1) − 2) = (k + 1)(3(k + 1) − 1)/2, which is 1 + 4 + ⋯ + (3k + 1) = ', { alg: '(k+1)(3k+2)/2', v: 'k' }, '. The left side of P(k + 1) is [1 + 4 + ⋯ + (3k − 2)] + (3k + 1) = ', { alg: 'k(3k-1)/2+3k+1', v: 'k' }, ' by ', { pick: ['the inductive hypothesis', 'the basis step', 'the definition of even'], a: 0 }, '. That equals (3k² − k + 6k + 2)/2 = (3k² + 5k + 2)/2 = ', { alg: '(k+1)(3k+2)/2', v: 'k' }, ', which is the right side of P(k + 1). Since the basis step and the inductive step are both proved, P(n) is true for every integer n ≥ 1. Q.E.D.'] },
    { type: 'parsons', hw: '5.2 #6', proof: 'indEven', q: 'Build the induction proof. Tap lines in order; some lines are traps.' },
    { type: 'parsons', hw: '5.2 #8', proof: 'indPow3', q: 'Build the proof. Watch where n starts.' },
    { type: 'write', hw: '5.2 #7', kind: 'proof', q: 'Prove by induction: <m>1 + 5 + 9 + ⋯ + (4n − 3) = n(2n − 1)</m> for every integer n ≥ 1.', model: 'Proof (by mathematical induction): Let P(n) be the equation 1 + 5 + 9 + ⋯ + (4n − 3) = n(2n − 1).\n\nBasis step: When n = 1, the left side is 4(1) − 3 = 1 and the right side is 1(2 · 1 − 1) = 1. So P(1) is true.\n\nInductive step: Let k be any integer with k ≥ 1, and suppose\n1 + 5 + ⋯ + (4k − 3) = k(2k − 1). [inductive hypothesis]\nWe must show\n1 + 5 + ⋯ + (4(k + 1) − 3) = (k + 1)(2(k + 1) − 1), that is,\n1 + 5 + ⋯ + (4k + 1) = (k + 1)(2k + 1).\n\nThe left side of P(k + 1) is\n[1 + 5 + ⋯ + (4k − 3)] + (4k + 1)\n= k(2k − 1) + (4k + 1)   by the inductive hypothesis\n= 2k² − k + 4k + 1\n= 2k² + 3k + 1\n= (k + 1)(2k + 1),\nwhich is the right side of P(k + 1).\n\nSince the basis step and the inductive step are both proved, P(n) is true for every integer n ≥ 1. Q.E.D.' },
    { type: 'write', hw: '5.2 #12', kind: 'proof', q: 'Prove by induction: <m>1/(1 · 2) + 1/(2 · 3) + ⋯ + 1/(n(n + 1)) = n/(n + 1)</m> for every integer n ≥ 1.', model: 'Proof (by mathematical induction): Let P(n) be the equation 1/(1 · 2) + 1/(2 · 3) + ⋯ + 1/(n(n + 1)) = n/(n + 1).\n\nBasis step: When n = 1, the left side is 1/(1 · 2) = 1/2 and the right side is 1/(1 + 1) = 1/2. So P(1) is true.\n\nInductive step: Let k be any integer with k ≥ 1, and suppose\n1/(1 · 2) + ⋯ + 1/(k(k + 1)) = k/(k + 1). [inductive hypothesis]\nWe must show\n1/(1 · 2) + ⋯ + 1/((k + 1)(k + 2)) = (k + 1)/(k + 2).\n\nThe left side of P(k + 1) is\n[1/(1 · 2) + ⋯ + 1/(k(k + 1))] + 1/((k + 1)(k + 2))\n= k/(k + 1) + 1/((k + 1)(k + 2))   by the inductive hypothesis\n= k(k + 2)/((k + 1)(k + 2)) + 1/((k + 1)(k + 2))\n= (k² + 2k + 1)/((k + 1)(k + 2))\n= (k + 1)²/((k + 1)(k + 2))\n= (k + 1)/(k + 2),\nwhich is the right side of P(k + 1).\n\nSince the basis step and the inductive step are both proved, P(n) is true for every integer n ≥ 1. Q.E.D.' },
    { type: 'mc', hw: '5.2 #18', q: 'Inductive step for <m>(1 − 1/2)(1 − 1/3)⋯(1 − 1/n) = 1/n</m>. After using the IH, the left side of P(k + 1) becomes:', o: ['(1/k) · (1 − 1/(k + 1))', '(1/k) + (1 − 1/(k + 1))', '(1/(k + 1)) · (1 − 1/k)', '(1/k)(1 − 1/k)'], sol: 'Split off the last factor (1 − 1/(k + 1)). The rest is (1 − 1/2)⋯(1 − 1/k), which the IH says is 1/k.<br>Then (1/k) · (k/(k + 1)) = 1/(k + 1).' },
    { type: 'num', hw: '5.2 #20', q: 'Use 1 + 2 + ⋯ + n = n(n + 1)/2 to compute <m>5 + 10 + 15 + ⋯ + 250</m>.', a: 6375, sol: '5 + 10 + ⋯ + 250 = 5(1 + 2 + ⋯ + 50), because 250/5 = 50<br>= 5 · 50(50 + 1)/2<br>= 5 · 50 · 51/2<br>= 5 · 1275<br>= 6375' },
    { type: 'num', hw: '5.2 #22a', q: 'Compute <m>4 + 5 + 6 + ⋯ + 100</m>.', a: 5044, sol: 'Fill in the missing front (1 + 2 + 3), then take it away:<br>(1 + 2 + ⋯ + 100) − (1 + 2 + 3)<br>= 100 · 101/2 − 6<br>= 5050 − 6<br>= 5044' },
    { type: 'mc', hw: '5.2 #22b', q: 'Closed form for <m>3 + 4 + 5 + ⋯ + m</m> (m ≥ 3):', o: ['m(m + 1)/2 − 3', 'm(m + 1)/2', 'm(m + 1)/2 − 2', '(m − 3)(m + 3)/2'], sol: '(1 + 2 + ⋯ + m) − (1 + 2) = m(m + 1)/2 − 3' },
    { type: 'mc', hw: '5.2 #24', q: 'Closed form for <m>1 + 2 + ⋯ + (k − 1)</m>:', o: ['(k − 1)k/2', 'k(k + 1)/2', '(k − 1)(k + 1)/2', 'k(k − 1)'], sol: 'Use n(n + 1)/2 with n = k − 1:<br>(k − 1)((k − 1) + 1)/2 = (k − 1)k/2' },
    { type: 'num', hw: '5.2 #25a', q: 'Compute <m>1 + 2 + 2² + ⋯ + 2⁸</m>.', a: 511, sol: '(2⁸⁺¹ − 1)/(2 − 1) = (512 − 1)/1 = 511' },
    { type: 'mc', hw: '5.2 #25c', q: 'Closed form for <m>2 + 2² + 2³ + ⋯ + 2ⁿ</m>:', o: ['2ⁿ⁺¹ − 2', '2ⁿ⁺¹ − 1', '2ⁿ − 1', '2ⁿ⁺¹'], sol: 'Add and remove the missing 1:<br>(1 + 2 + ⋯ + 2ⁿ) − 1 = (2ⁿ⁺¹ − 1) − 1 = 2ⁿ⁺¹ − 2' },
    { type: 'mc', hw: '5.2 #26', q: 'Closed form for <m>4 + 4² + ⋯ + 4ⁿ</m> (n ≥ 1):', o: ['(4ⁿ⁺¹ − 4)/3', '(4ⁿ⁺¹ − 1)/3', '(4ⁿ − 1)/3', '4ⁿ⁺¹ − 4'], sol: '(1 + 4 + ⋯ + 4ⁿ) − 1<br>= (4ⁿ⁺¹ − 1)/(4 − 1) − 1<br>= (4ⁿ⁺¹ − 1)/3 − 3/3<br>= (4ⁿ⁺¹ − 4)/3' },
    { type: 'num', hw: '5.2 #28', q: 'Compute <m>1 + 1/3 + 1/3² + 1/3³</m>. Type a fraction.', a: 40 / 27, sol: 'Easiest: common denominator 27.<br>27/27 + 9/27 + 3/27 + 1/27 = 40/27<br>Formula check, r = 1/3, n = 3: ((1/3)⁴ − 1)/(1/3 − 1) = (−80/81)/(−2/3) = 80/81 · 3/2 = 40/27 ✓' },
    { type: 'mc', hw: '5.2 #30', q: '1/(1 · 3) = 1/3. Adding 1/(3 · 5) gives 2/5. Adding 1/(5 · 7) gives 3/7. Adding 1/(7 · 9) gives 4/9. Guess the formula for n terms.', o: ['n/(2n + 1)', '1/(2n + 1)', 'n/(n + 2)', '(n + 1)/(2n + 1)'], sol: 'Tops: 1, 2, 3, 4 → n. Bottoms: 3, 5, 7, 9 → 2n + 1. Guess n/(2n + 1), then prove it by induction.' },

const gcdQ = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function Q(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcdQ(n, d); return { n: n / g, d: d / g }; }
const qAdd = (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d), qMul = (a, b) => Q(a.n * b.n, a.d * b.d);
const qEq = (a, b) => a.n === b.n && a.d === b.d;
const qStr = q => q.d === 1 ? fmt(q.n) : fmt(q.n) + '/' + q.d;
const qPar = q => (q.n < 0 || q.d !== 1) ? '(' + qStr(q) + ')' : qStr(q);
const factQ = k => { let p = 1; for (let i = 2; i <= k; i++) p *= i; return p; };
const sup = x => '<sup>' + fmt(x) + '</sup>';
const SEQ_R = [
  { id: 'k', show: 'k', f: k => Q(k), sub: k => fmt(k) },
  { id: 'k1', show: '(k + 1)', f: k => Q(k + 1), sub: k => signed(k) + ' + 1' },
  { id: 'odd', show: '(2k − 1)', f: k => Q(2 * k - 1), sub: k => '2 · ' + signed(k) + ' − 1' },
  { id: 'sq', show: 'k²', f: k => Q(k * k), sub: k => signed(k) + '²' },
  { id: 'pow', show: '2ᵏ', f: k => k >= 0 ? Q(2 ** k) : Q(1, 2 ** -k), sub: k => '2' + sup(k) },
  { id: 'sgn', show: '(−1)ᵏ', f: k => Q(Math.abs(k) % 2 === 0 ? 1 : -1), sub: k => '(−1)' + sup(k) },
  { id: 'tel', show: '(1/k − 1/(k + 1))', f: k => k === 0 || k === -1 ? null : qAdd(Q(1, k), Q(-1, k + 1)), sub: k => '1/' + signed(k) + ' − 1/' + (k + 1 < 0 ? '(' + fmt(k + 1) + ')' : fmt(k + 1)) },
  { id: 'fac', show: 'k!', f: k => k < 0 ? null : Q(factQ(k)), sub: k => fmt(k) + '!' }
];
function labSeq(body) {
  const st = { r: 'sq', op: 'Σ', lo: 1, hi: 4, split: false };
  const w = el('div', 'stack'); body.appendChild(w);

  w.innerHTML = '<div class="card stack"><div><span class="eyebrow">Σ and Π machine</span><h2 class="lab-h">Watch every term get plugged in</h2><p class="muted">Pick a recipe, add or multiply, and the bounds. The machine writes out each step the way you would on paper.</p></div>' +
    '<div class="ctl"><span class="ctl-l">Recipe</span><div class="subtabs" id="sq-r">' + SEQ_R.map(r => '<button type="button" data-r="' + r.id + '">' + r.show + '</button>').join('') + '</div></div>' +
    '<div class="ctl"><span class="ctl-l">Do what?</span><div class="subtabs" id="sq-op"><button type="button" data-op="Σ">Σ add</button><button type="button" data-op="Π">Π multiply</button></div></div>' +
    '<div class="ctl"><span class="ctl-l">Bounds</span><div class="row">' + stepper('lo', 'Start (bottom)') + stepper('hi', 'Stop (top)') + '</div></div>' +
    '<label class="chk" for="sq-split"><input type="checkbox" id="sq-split"> Separate off the last term</label></div>' +
    '<div class="card stack" id="sq-out" aria-live="polite"></div>';
  const out = $('#sq-out', w);

    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.r) st.r = b.dataset.r;
    else if (b.dataset.op) st.op = b.dataset.op;
    else if (b.dataset.d) st[b.dataset.d] = Math.max(-3, Math.min(8, st[b.dataset.d] + +b.dataset.v));

  $('#sq-split', w).addEventListener('change', e => { st.split = e.target.checked; draw(); });
  function draw() {

    const R = SEQ_R.find(r => r.id === st.r), isSum = st.op === 'Σ', OP = isSum ? SUM : PROD, joiner = isSum ? ' + ' : ' · ';
    let h = '<div class="eq-big">' + OP('k=' + fmt(st.lo), fmt(st.hi), R.show) + '</div>';

    const ks = []; for (let k = st.lo; k <= st.hi; k++) ks.push(k);

    if (badK !== undefined) { out.innerHTML = h + '<p class="fb bad">k = ' + fmt(badK) + ' makes this recipe undefined (' + (R.id === 'fac' ? 'no factorial for negatives' : 'dividing by 0') + '). Move the start up.</p>'; return; }
    h += '<p class="muted">Number of terms = top − bottom + 1 = ' + fmt(st.hi) + ' − ' + signed(st.lo) + ' + 1 = ' + ks.length + '</p>';
    h += '<div class="sq-rows">' + ks.map((k, i) => '<div class="sq-row"><span class="sq-k">k = ' + fmt(k) + '</span><span>' + R.sub(k) + ' = <b>' + qStr(terms[i]) + '</b></span></div>').join('') + '</div>';
    const tot = terms.reduce(isSum ? qAdd : qMul, Q(isSum ? 0 : 1));
    h += '<div class="sq-total">' + terms.map(qPar).join(joiner) + ' = <b>' + qStr(tot) + '</b></div>';
    if (R.id === 'tel' && isSum) h += '<div class="box think"><span class="eyebrow">Telescoping</span>Every middle piece cancels. What’s left: 1/' + signed(st.lo) + ' − 1/' + fmt(st.hi + 1) + ' = ' + qStr(tot) + '</div>';
    if (st.split) {

      q: { q: '(2k + 1)² = ?', o: ['4k² + 4k + 1', '4k² + 1', '2k² + 4k + 1', '4k² + 2k + 1'], w: '(2k + 1)(2k + 1) = 4k² + 2k + 2k + 1 = 4k² + 4k + 1.' } },
    { t: 'Same theorem, by contradiction', b: '<p>Any if-then can be proved either way. Here is “if n² is even, then n is even” again, by contradiction:</p>',
      ex: 'Suppose not. Suppose there is an integer n such that n² is even and n is odd.<br>Since n is odd, n = 2k + 1, so n² = 2(2k² + 2k) + 1 (same algebra as before), which is odd.<br>So n² is both even and odd. That contradicts the theorem that no integer is both even and odd.<br>Hence the supposition is false, and the statement is true. Q.E.D.',
      think: '<b>Which one should I pick?</b><br>“There is no…”, “… is irrational”, “… is not divisible by…” → contradiction.<br>“If P then Q” where “not Q” is easy to use (n is odd → n = 2k + 1) → contraposition.<br>Stuck? Contradiction works for anything.',
      q: { q: 'Prove “There is no greatest even integer.” Best method?', o: ['Contradiction', 'Contraposition', 'Checking examples', 'A counterexample'], w: '“There is no…” has no if-then to flip. Suppose there IS a greatest even integer.' } },
    { t: '4.8: two famous results (know them, don’t write them)', b: '<p>Your professor said you will <b>not</b> have to reproduce these two proofs. You just need to know the results and the idea.</p><p><b>√2 is irrational.</b><br>Idea: suppose √2 = m/n in lowest terms. Then m² = 2n², so m is even. Then n is even too. Both even means it wasn’t in lowest terms. Contradiction.</p><p><b>There are infinitely many primes.</b><br>Idea: suppose the only primes are p₁, p₂, …, pₙ. Let N = p₁ · p₂ ⋯ pₙ + 1. Some prime divides N, but every pᵢ leaves remainder 1. Contradiction.</p><p><b>Helper result:</b> If p is prime and p | a, then p ∤ (a + 1). (Example: 3 | 12, so 3 ∤ 13.)</p>',
      think: 'Both famous proofs are proofs by contradiction. And the √2 proof uses the 4.7 result: m² even means m is even.',
      q: { q: 'Which of these can you USE as a known fact on Quiz 3?', o: ['√2 is irrational', 'The sum of two irrational numbers is irrational', 'Every prime is odd', 'N = p₁p₂⋯pₙ + 1 is always prime'], w: 'That’s the 4.8 theorem. The others are false: √2 + (−√2) = 0, 2 is prime, and 2·3·5·7·11·13 + 1 = 30031 = 59 · 509.' } },
    { t: 'Using “√2 is irrational” as a tool', b: '<p>A very likely quiz question: prove that some number built from √2 is irrational. The move: suppose it’s rational, then <b>solve for √2</b>.</p>',
      ex: '<b>Theorem:</b> 1 + 3√2 is irrational.<br><br>Suppose not. Suppose 1 + 3√2 is rational.<br>Then 1 + 3√2 = a/b for some integers a and b with b ≠ 0.<br>Subtract 1:<br>3√2 = a/b − 1 = a/b − b/b = (a − b)/b<br>Divide by 3:<br>√2 = (a − b)/(3b)<br>a − b and 3b are integers, and 3b ≠ 0 because b ≠ 0.<br>So √2 is rational. That contradicts the theorem that √2 is irrational.<br>Hence the supposition is false, and 1 + 3√2 is irrational. Q.E.D.',
      think: 'Pattern: undo the + and × until √2 is alone. If √2 = (integer)/(nonzero integer), that’s the contradiction.',
      q: { q: 'Suppose 5 − √2 = a/b. Solving for √2 gives:', o: ['√2 = (5b − a)/b', '√2 = (a − 5b)/b', '√2 = (5 − a)/b', '√2 = a/(5b)'], w: '√2 = 5 − a/b = 5b/b − a/b = (5b − a)/b.' } },
    { t: 'The quiz templates (copy these)', b: '<div class="box ex tpl"><b>Proof (by contradiction):</b> Suppose not. That is, suppose ______. [the exact negation]<br>By definition of ___, ______.<br>…algebra…<br>So ______, which contradicts ______.<br>Hence the supposition is false, and ______ is true. Q.E.D.</div><div class="box ex tpl"><b>Proof (by contraposition):</b> The contrapositive is: for every ___, if ______ [not Q], then ______ [not P].<br>Suppose ___ is any particular but arbitrarily chosen ___ such that ______ [not Q].<br>By definition of ___, ______.<br>…algebra…<br>So ______ [not P].<br>Hence the contrapositive is true, and since it is logically equivalent to the original, the statement is true. Q.E.D.</div>',
      think: '12 minutes is about 5 minutes per proof. Write the first line and the last line FIRST. They earn points even if the algebra slips.',
      q: { q: 'The last line of a proof by contradiction says:', o: ['Hence the supposition is false, and the statement is true.', 'Hence the contrapositive is true.', 'So it works for n = 1, 2 and 3.', 'So the supposition is true.'], w: 'You supposed it was false and broke math, so the supposition must be false.' } }
  ],
  items: [
    { type: 'mc', q: 'Prove by contradiction: <b>There is no greatest even integer.</b> What is the first line?', o: ['Suppose not. Suppose there is a greatest even integer N, so N ≥ n for every even integer n.', 'Suppose there is no greatest even integer.', 'Let N = 100. Then N + 2 = 102 is bigger.', 'Suppose every even integer is less than N + 2.'], sol: 'Negate “there is no greatest even integer”: there IS one. Name it N.<br>Then N + 2 is even (N = 2k, so N + 2 = 2(k + 1)) and N + 2 > N. Contradiction.' },
    { type: 'mc', q: 'Prove by contraposition: <b>For every integer n, if 5n + 3 is even, then n is odd.</b> Which statement do you actually prove?', o: ['For every integer n, if n is even, then 5n + 3 is odd.', 'For every integer n, if n is odd, then 5n + 3 is even.', 'For every integer n, if 5n + 3 is odd, then n is even.', 'There is an integer n such that 5n + 3 is even and n is even.'], sol: 'Contrapositive: negate both parts and swap them.<br>not Q = n is even. not P = 5n + 3 is odd.<br>“If n is even, then 5n + 3 is odd.”<br>(Option 2 is the converse, option 3 is the inverse, option 4 is the negation.)' },
    { type: 'mc', q: 'Prove by contradiction: <b>For every integer n, if n² is odd, then n is odd.</b> What do you suppose?', o: ['There is an integer n such that n² is odd and n is even.', 'For every integer n, if n² is even, then n is even.', 'There is an integer n such that n² is even and n is odd.', 'There is an integer n such that if n² is odd, then n is even.'], sol: 'Negation of ∀n, P(n) → Q(n) is ∃n such that P(n) and not Q(n).<br>P = n² is odd. not Q = n is even.<br>Suppose there is an integer n such that n² is odd and n is even.' },
    { type: 'mc', q: 'Prove by contradiction: <b>The difference of any rational number and any irrational number is irrational.</b> What do you suppose?', o: ['There are a rational number r and an irrational number s such that r − s is rational.', 'There are a rational number r and an irrational number s such that r − s is irrational.', 'r and s are both rational, and r − s is rational.', 'r − s = a/b for some real numbers a and b.'], sol: 'Keep the setup (r rational, s irrational) and negate the conclusion (r − s irrational → r − s rational).' },
    { type: 'ms', q: 'Statement: <b>For all integers m and n, if mn is even, then m is even or n is even.</b> Select every correct way to start a proof.', o: [['Contraposition: Suppose m and n are integers with m odd and n odd. (Then show mn is odd.)', true], ['Contradiction: Suppose there are integers m and n such that mn is even, m is odd, and n is odd.', true], ['Suppose m and n are integers with mn odd.', false], ['Suppose m is even or n is even.', false]], sol: 'not (m even or n even) = m odd AND n odd (De Morgan).<br>Contraposition starts from that: m odd and n odd, then shows mn is odd.<br>Contradiction keeps “mn is even” and adds “m odd and n odd.”<br>“mn odd” is the inverse’s starting point, and “m even or n even” starts the converse.' },
    { type: 'mc', q: 'Contrapositive of: <b>For every real number x, if x² > 4, then x > 2 or x < −2.</b>', o: ['For every real number x, if −2 ≤ x ≤ 2, then x² ≤ 4.', 'For every real number x, if x > 2 or x < −2, then x² > 4.', 'For every real number x, if x² ≤ 4, then −2 ≤ x ≤ 2.', 'For every real number x, if −2 < x < 2, then x² < 4.'], sol: 'not Q: not (x > 2 or x < −2) = x ≤ 2 and x ≥ −2, which is −2 ≤ x ≤ 2.<br>not P: not (x² > 4) = x² ≤ 4.<br>Swap: if −2 ≤ x ≤ 2, then x² ≤ 4.<br>(Watch the endpoints: the negation of &gt; is ≤.)' },
    { type: 'tf', q: 'A statement and its contrapositive are logically equivalent.', a: true, sol: 'p → q ≡ ~q → ~p. Same truth table. That is why proof by contraposition works.' },
    { type: 'tf', q: 'To prove “∀x, if P(x) then Q(x)” by contradiction, you suppose that P(x) is false.', a: false, sol: 'You suppose the WHOLE statement is false: there is an x where P(x) is true and Q(x) is false.' },
    { type: 'tf', q: 'The sum of any two irrational numbers is irrational.', a: false, sol: 'Counterexample: √2 and −√2 are both irrational, but √2 + (−√2) = 0, and 0 = 0/1 is rational.' },
    { type: 'mc', q: 'Prove: <b>5 − √2 is irrational.</b> Which method fits best?', o: ['Contradiction: suppose 5 − √2 is rational', 'Contraposition: flip the if-then', 'Check a few decimal places', 'Find a counterexample'], sol: '“Irrational” means “not rational,” and there is no if-then to flip. Suppose 5 − √2 = a/b, solve: √2 = (5b − a)/b, so √2 would be rational, contradicting the theorem that √2 is irrational.' },
    { type: 'mc', q: 'Prove: <b>For every integer n, if 3n + 1 is even, then n is odd.</b> Which method is cleanest?', o: ['Contraposition: suppose n is even, show 3n + 1 is odd', 'Contradiction is the only way', 'A direct proof starting from n = 2k + 1', 'Checking n = 1, 3, 5'], sol: 'not Q = “n is even” is easy to use: n = 2k.<br>3n + 1 = 3(2k) + 1 = 6k + 1 = 2(3k) + 1, which is odd. Done.<br>(Contradiction works too, it’s just longer. Starting from n = 2k + 1 would assume the conclusion.)' },
    { type: 'fill', q: '<b>Fill in the proof by contradiction:</b> There is no greatest even integer.', parts: ['Suppose not. That is, suppose there is ', { pick: ['a greatest even integer N', 'no greatest even integer', 'an even integer greater than every integer'], a: 0 }, '. Then N ≥ n for every even integer n. Since N is even, N = 2k for some integer k. Let M = ', { pick: ['N + 2', 'N + 1', 'N − 2'], a: 0 }, '. Then M = 2k + 2 = 2(', { alg: 'k+1', v: 'k' }, '), so M is even. Also M > N. This contradicts ', { pick: ['the supposition that N is the greatest even integer', 'the definition of odd', 'the fact that √2 is irrational'], a: 0 }, '. Hence the supposition is false, and there is no greatest even integer. Q.E.D.'] },
    { type: 'fill', q: '<b>Fill in the proof by contraposition:</b> For every integer n, if n² is odd, then n is odd.', parts: ['The contrapositive is: for every integer n, if ', { pick: ['n is even', 'n is odd', 'n² is even'], a: 0 }, ', then ', { pick: ['n² is even', 'n² is odd', 'n is odd'], a: 0 }, '. Suppose n is any particular but arbitrarily chosen even integer. Then n = 2k for some integer k. So n² = (2k)² = ', { alg: '4k^2', v: 'k' }, ' = 2(', { alg: '2k^2', v: 'k' }, '). Since 2k² is an integer, n² is even. So the contrapositive is true, and since a statement is ', { pick: ['logically equivalent to its contrapositive', 'logically equivalent to its converse', 'always true'], a: 0 }, ', the original statement is true. Q.E.D.'] },
    { type: 'fill', q: '<b>Fill in the proof:</b> 3√2 − 7 is irrational. (You may use that √2 is irrational.)', parts: ['Suppose not. Suppose 3√2 − 7 is ', { pick: ['rational', 'irrational', 'an integer'], a: 0 }, '. Then 3√2 − 7 = a/b for some integers a and b with b ≠ 0. Add 7: 3√2 = a/b + 7 = ', { pick: ['(a + 7b)/b', '(a + 7)/b', '(7a + b)/b'], a: 0 }, '. Divide by 3: √2 = ', { pick: ['(a + 7b)/(3b)', '(a + 7b)/3', '3(a + 7b)/b'], a: 0 }, '. Since a + 7b and 3b are integers and 3b ≠ 0, √2 is rational. This contradicts ', { pick: ['the theorem that √2 is irrational', 'the supposition that b ≠ 0', 'the definition of even'], a: 0 }, '. Hence 3√2 − 7 is irrational. Q.E.D.'] },
    { type: 'parsons', proof: 'cp5n3', q: 'Build the proof by contraposition. Tap lines in order; some lines are traps.' },
    { type: 'parsons', proof: 'ctrProd', q: 'Build the proof by contradiction. Watch the division step.' },
    { type: 'parsons', proof: 'ctrN2', q: 'Build the proof by contradiction. This one uses “if n² is even, then n is even” in the middle.' },
    { type: 'mc', q: 'Find the mistake. To prove “if n² is even, then n is even,” a student writes: “Suppose n is even, so n = 2k. Then n² = 4k² = 2(2k²), which is even. Q.E.D.”', o: ['That proves the converse (if n is even, then n² is even). Contraposition starts from “n is odd.”', 'Nothing is wrong.', '4k² is not even.', 'It should start with n = 2k + 2.'], sol: 'The student started from Q (n is even) and reached P (n² is even). That is the converse.<br>Contrapositive: if n is odd, then n² is odd. Start from n = 2k + 1.' },
    { type: 'mc', q: 'Find the mistake. “Theorem: 2 + √2 is irrational. Proof: Suppose 2 + √2 is irrational. Then …”', o: ['It supposes the conclusion. It should suppose 2 + √2 is rational.', 'It should start with “Let √2 = 1.414.”', 'It should be a proof by contraposition.', 'Nothing is wrong.'], sol: 'In a proof by contradiction you suppose the statement is FALSE. False here means 2 + √2 is rational, so 2 + √2 = a/b.' },
    { type: 'mc', q: 'p is prime and p | a. What do you know about a + 1?', o: ['p ∤ (a + 1)', 'p | (a + 1)', 'a + 1 is prime', 'Nothing'], sol: 'This is one of the 4.8 results. Why: if p | a and p | (a + 1), then p divides their difference (a + 1) − a = 1. But a prime is at least 2 and can’t divide 1.<br>Example: 5 | 20, and 5 ∤ 21.' },
    { type: 'num', q: 'Euclid’s idea: pretend the only primes are 2, 3 and 5. Compute N = 2 · 3 · 5 + 1.', a: 31, sol: 'N = 2 · 3 · 5 + 1 = 30 + 1 = 31<br>31 ÷ 2, 31 ÷ 3 and 31 ÷ 5 each leave remainder 1, so none of them divides 31.<br>But every integer > 1 has a prime factor, so there is a prime missing from the list (here, 31 itself). That is why the list of primes can never be finished.' },
    { type: 'tf', q: 'In the infinitely-many-primes proof, N = p₁ · p₂ ⋯ pₙ + 1 is always a prime number.', a: false, sol: '2 · 3 · 5 · 7 · 11 · 13 + 1 = 30031 = 59 · 509, not prime.<br>The proof only needs N to have SOME prime factor that is not on the list.' },
    { type: 'mc', q: 'In the proof that √2 is irrational, you reach m² = 2n². What comes next?', o: ['m² is even, so m is even (the 4.7 result)', 'm = 2n', 'm and n are both odd', 'm² is odd, so m is odd'], sol: 'm² = 2n² is 2 times an integer, so m² is even. By the 4.7 result (if n² is even, then n is even), m is even.<br>That is the link between 4.7 and 4.8.' },
    { type: 'mc', q: 'Negate (for a proof by contradiction): <b>The product of any two odd integers is odd.</b>', o: ['There are two odd integers whose product is even.', 'The product of any two even integers is even.', 'There are two even integers whose product is odd.', 'Every product of two odd integers is even.'], sol: '“For all odd m, n: mn is odd” negates to “there exist odd m, n with mn not odd,” and for integers “not odd” = even.' },
    { type: 'write', kind: 'proof', q: 'Prove by contraposition: <m>For every integer n, if n³ is even, then n is even.</m>', model: 'Proof (by contraposition): The contrapositive is: for every integer n, if n is odd, then n³ is odd.\n\nSuppose n is any particular but arbitrarily chosen odd integer. By definition of odd, n = 2k + 1 for some integer k.\n\nn³ = (2k + 1)³\n= (2k + 1)(2k + 1)(2k + 1)\n= (4k² + 4k + 1)(2k + 1)\n= 8k³ + 4k² + 8k² + 4k + 2k + 1\n= 8k³ + 12k² + 6k + 1\n= 2(4k³ + 6k² + 3k) + 1\n\nLet t = 4k³ + 6k² + 3k. Then t is an integer because products and sums of integers are integers. So n³ = 2t + 1, which is odd by definition of odd.\n\nHence the contrapositive is true, and since a statement is logically equivalent to its contrapositive, the original statement is true. Q.E.D.' },
    { type: 'write', kind: 'proof', q: 'Prove by contradiction: <m>1 + 3√2 is irrational.</m> You may use that √2 is irrational.', model: 'Proof (by contradiction): Suppose not. That is, suppose 1 + 3√2 is rational.\n\nBy definition of rational, 1 + 3√2 = a/b for some integers a and b with b ≠ 0.\n\nSubtract 1:\n3√2 = a/b − 1 = a/b − b/b = (a − b)/b\n\nDivide by 3:\n√2 = (a − b)/(3b)\n\na − b and 3b are integers because differences and products of integers are integers, and 3b ≠ 0 because b ≠ 0. So √2 is rational by definition of rational.\n\nThis contradicts the theorem that √2 is irrational. Hence the supposition is false, and 1 + 3√2 is irrational. Q.E.D.' },
    { type: 'write', kind: 'proof', q: 'Prove by contradiction: <m>There is no least positive rational number.</m>', model: 'Proof (by contradiction): Suppose not. That is, suppose there is a least positive rational number r. Then r > 0, and r ≤ x for every positive rational number x.\n\nBy definition of rational, r = a/b for some integers a and b with b ≠ 0.\n\nConsider r/2. Then r/2 = a/(2b). a and 2b are integers and 2b ≠ 0, so r/2 is rational.\n\nAlso r/2 > 0 because r > 0, and r/2 < r because r > 0.\n\nSo r/2 is a positive rational number smaller than r. This contradicts the supposition that r is the least positive rational number.\n\nHence the supposition is false, and there is no least positive rational number. Q.E.D.' },
    { type: 'write', kind: 'proof', q: 'Prove in two ways, once by contraposition and once by contradiction: <m>For every integer n, if n² is odd, then n is odd.</m>', model: 'By contraposition:\nThe contrapositive is: for every integer n, if n is even, then n² is even.\nSuppose n is any particular but arbitrarily chosen even integer. Then n = 2k for some integer k.\nn² = (2k)² = 4k² = 2(2k²). 2k² is an integer, so n² is even.\nHence the contrapositive is true, and since it is logically equivalent to the original, the statement is true. Q.E.D.\n\nBy contradiction:\nSuppose not. Suppose there is an integer n such that n² is odd and n is even.\nSince n is even, n = 2k for some integer k, so n² = (2k)² = 4k² = 2(2k²), which is even.\nSo n² is both odd and even. This contradicts the theorem that no integer is both even and odd.\nHence the supposition is false, and the statement is true. Q.E.D.' }
  ]
});

    { t: 'Proof by contradiction', s: ['<b>Suppose not.</b> Write the exact negation. “∀x, if P(x) then Q(x)” becomes “∃x such that P(x) and not Q(x).”', 'Unpack with definitions: even n = 2k, odd n = 2k + 1, rational r = a/b (integers, b ≠ 0), d | n means n = dk.', 'Do algebra until something impossible appears: integer = 1/2, even and odd, √2 = integer/integer, a number bigger than the biggest.', 'Name it: “This contradicts …”.', '“Hence the supposition is false, and [the statement] is true.” Q.E.D.'] },
    { t: 'Proof by contraposition', s: ['Write the contrapositive: <b>if not Q, then not P</b>. Negate both parts AND swap them.', '“Suppose x is any particular but arbitrarily chosen … such that [not Q].”', 'Direct proof with definitions until you reach [not P].', '“Hence the contrapositive is true, and since it is logically equivalent to the original, the statement is true.” Q.E.D.'] },
    { t: 'Using the 4.8 results', s: ['√2 is irrational: solve your equation for √2. If √2 = integer/nonzero integer, that is the contradiction.', 'If p is prime and p | a, then p ∤ (a + 1).', 'There are infinitely many primes. Know the idea (N = p₁ ⋯ pₙ + 1), but you won’t write the proof.'] },
    { t: '12-minute quiz timing', s: ['Read every question first (30 seconds).', 'For each proof, write the method and the first line before any algebra.', 'About 5 minutes per proof. Save 1 minute to write the last lines.'] }],
  ex: { q: 'Prove by contraposition: for every integer n, if n² is even, then n is even.', a: 'Contrapositive: for every integer n, if n is odd, then n² is odd.<br>Suppose n is any particular but arbitrarily chosen odd integer. Then n = 2k + 1 for some integer k.<br>n² = (2k + 1)² = 4k² + 4k + 1 = 2(2k² + 2k) + 1<br>Let t = 2k² + 2k, an integer. So n² = 2t + 1 is odd.<br>Hence the contrapositive is true, so the original statement is true. Q.E.D.' },

function factorChain(n) {

}

function numberLine(lo, hi, draw, h = 80) {

}

    '−': [['2r − 2s', '2(r − s)', 'r − s', 0], ['2r − 2s − 1', '2(r − s − 1) + 1', 'r − s − 1', 1], ['2r + 1 − 2s', '2(r − s) + 1', 'r − s', 1], ['2r + 1 − 2s − 1', '2(r − s)', 'r − s', 0]],
    '·': [['4rs', '2(2rs)', '2rs', 0], ['4rs + 2r', '2(2rs + r)', '2rs + r', 0], ['4rs + 2s', '2(2rs + s)', '2rs + s', 0], ['4rs + 2r + 2s + 1', '2(2rs + r + s) + 1', '2rs + r + s', 1]]

    ['Suppose', 'Suppose m is any [particular but arbitrarily chosen] ' + pm + ' integer and n is any [particular but arbitrarily chosen] ' + pn + ' integer. [We must show that ' + ex + ' is ' + res + '.]'],

  { secs: ['2.2'], title: 'Conditionals: the four variants and “only if”',
    why: 'Contrapositive, converse, inverse, and negation of one conditional is the classic 2.2 exam question. His picks #19, #20, #24, #26, #34 are exactly this.',

  const R = resumeInfo(), F = nextFocus();
  const tile = (k, name, mins, txt) => '<button type="button" class="etile" data-energy="' + k + '"><span class="ebat ' + k + '" aria-hidden="true"><i></i></span><span class="etxt"><b>' + name + '</b><span class="emin">' + mins + '</span><span class="edesc">' + txt + '</span></span></button>';
  const cheer = ['One small step at a time!', 'Tiny wins count.', 'A B is totally doable.', 'Water first, then one card.', 'You showed up. That’s the hard part.', 'Just one section today is enough.'];
  main.innerHTML = '<section class="today">' + MASCOT + '<span class="eyebrow">' + new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + '</span><h1>' + hello + '</h1><p>You don’t have to do everything today. Pick how much energy you have, and do just that.</p><p class="bubble" aria-hidden="true">' + cheer[Math.floor(Math.random() * cheer.length)] + '</p></section>' +
    quizCard() +
    '<div class="energy">' +
      tile('low', 'Low battery', '≈ 10 min', '5 quick questions from things you’ve already started. No proofs.') +
      tile('mid', 'Some energy', '≈ 25 min', 'The game plan for §' + F.num + ' ' + F.short + ', then 5 problems.') +
      tile('full', 'Full tank', '≈ 60 min', 'A mock exam with a grade at the end.') +
    '</div>' +
    (R ? '<button type="button" class="resume" data-resume="1"><span class="eyebrow">Pick up where you left off</span><b>§' + R.st.num + ' ' + R.st.name + '</b><span class="muted">' + R.where + '</span><span class="go" aria-hidden="true">→</span></button>' : '') +
    '<h2 class="h-sec">' + (quizDays() >= 0 ? 'Now · Quiz 3' : 'Now') + '</h2><div class="slist">' + NOW.map(stById).map(srow).join('') + '</div>' +
    '<h2 class="h-sec">Chapter 5</h2><div class="slist">' + CH5.map(stById).map(srow).join('') + '</div>' +
    '<h2 class="h-sec">Your professor’s problems</h2><div class="hwlist">' + HWHUB.map(([id, tag, what]) => { const t = hwTarget(id, tag); return '<button type="button" class="hwrow" data-hw="' + id + ':' + t.idx + '"><span class="hwn">' + tag + '</span><span>' + what + '</span><span class="scount">' + (t.total ? t.done + ' / ' + t.total : '') + (t.total && t.done === t.total ? ' ✓' : '') + '</span></button>'; }).join('') + '</div>' +
    '<details class="older"><summary>Exam 1 sections <span class="muted">§1.2 – §4.5, for review and the final</span></summary><div class="slist">' + STATIONS.filter(s => !RECENT.includes(s.id)).map(srow).join('') + '</div></details>' +
    '<div class="tools"><span class="eyebrow">Exam tools</span><div class="row"><button type="button" class="btn ghost" data-go="plans">Game plans</button><button type="button" class="btn ghost" data-go="run">Mock exam</button><button type="button" class="btn ghost" data-go="cram">Likely 7</button><button type="button" class="btn ghost" data-go="review">Rapid review</button></div></div>';
  main.addEventListener('click', e => {
    const b = e.target.closest('[data-st],[data-go],[data-energy],[data-resume],[data-hw],[data-q3]'); if (!b) return;
    if (b.dataset.q3) { if (b.dataset.q3 === 'run') { S.run = buildRun('q3'); save(); go({ v: 'run' }); } else go({ v: 'st', id: 'indir', tab: b.dataset.q3 }); }
    else if (b.dataset.st) go({ v: 'st', id: b.dataset.st, tab: (S.lastTab && S.lastTab[b.dataset.st]) || 'learn' });
    else if (b.dataset.go) go({ v: b.dataset.go });
    else if (b.dataset.resume) go({ v: 'st', id: R.st.id, tab: R.tab || 'learn' });
    else if (b.dataset.hw) { const [id, i] = b.dataset.hw.split(':'); go({ v: 'st', id, tab: 'practice', item: Math.max(0, +i) }); }
    else if (b.dataset.energy === 'low') startSet('quick');
    else if (b.dataset.energy === 'mid') go({ v: 'st', id: F.id, tab: 'plan' });
    else go({ v: 'run' });
  });
}

/* ---------- Quiz 3 countdown card ---------- */
function quizCard() {
  const d = quizDays(); if (d < 0) return '';
  const when = d === 0 ? 'Today, end of class' : d === 1 ? 'Tomorrow' : 'In ' + d + ' days';
  const wd = new Date().getDay(), step = (day, txt) => '<span' + (wd === day ? ' class="now"' : '') + '>' + txt + '</span>';
  return '<section class="q3card"><div class="q3top"><span class="q3days"><b>' + (d === 0 ? '!' : d) + '</b><small>' + (d === 0 ? 'today' : d === 1 ? 'day' : 'days') + '</small></span><div><span class="eyebrow">Quiz 3 · Thursday 10/29 · ' + when + '</span><h2>§4.7–4.8 Indirect proof</h2><p>12 minutes at the end of class. Two recipes: <b>contradiction</b> and <b>contraposition</b>. You won’t have to write the √2 or primes proofs.</p></div></div>' +
    '<div class="q3plan">' + step(1, 'Mon · 🔁 contraposition') + step(2, 'Tue · 💥 contradiction') + step(3, 'Wed · fake quiz') + step(4, 'Thu · 10-min look') + '</div>' +
    '<div class="row"><button type="button" class="btn accent" data-q3="learn">Learn it</button><button type="button" class="btn ghost" data-q3="lab">First-line drill</button><button type="button" class="btn ghost" data-q3="run">Fake quiz · 12 min</button></div></section>';
}

/* ---------- short sets (low energy, or 5 problems after a game plan) ---------- */
function startSet(mode, st) {
  const r = rng((Date.now() & 0xffffff) + 11);
  const easy = it => ['mc', 'tf', 'num', 'set', 'pick', 'ms'].includes(it.type);
  let pool;
  if (mode === 'sec' && st) pool = st.items.filter(it => !['gbuild', 'relabel', 'eetable', 'write'].includes(it.type));
  else {
    const started = STATIONS.filter(s => S.seen[s.id] != null || solvedCount(s) > 0).map(s => s.id);
    pool = ALL_ITEMS.filter(it => easy(it) && (started.length ? started.includes(it.st) : it.st === nextFocus().id));
  }
  const score = it => (S.peek[it.key] ? 0 : 2) + (S.done[it.key] ? 3 : 0) + r();
  const keys = pool.slice().sort((a, b) => score(a) - score(b)).slice(0, 5).map(it => it.key);
  for (let i = keys.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
  S.run = { mode, keys, i: 0, res: {}, t0: Date.now(), sec: st ? st.id : null };
  save(); go({ v: 'run' });
}

/* ---------- section ---------- */
function viewStation(main, st, tab) {
  S.lastTab = S.lastTab || {}; S.lastTab[st.id] = tab; S.last = { id: st.id, tab }; save();
  const n = solvedCount(st);
  main.innerHTML = backBtn() + '<div class="st-head"><div class="st-num">' + st.num + '</div><h1>' + st.name + '</h1><p>' + st.blurb + '</p></div>' +
    '<div class="tabs" role="tablist">' + [['learn', 'Learn', st.cards.length + ''], ['plan', 'Game plan', ''], ['practice', 'Practice', n + '/' + st.items.length], ['lab', 'Lab', '']].map(t => '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + (t[2] ? '<small>' + t[2] + '</small>' : '') + '</button>').join('') + '</div><div id="tabbody"></div>';
  $('.tabs', main).addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go({ v: 'st', id: st.id, tab: b.dataset.tab }); });
  const body = $('#tabbody', main);
  if (tab === 'learn') viewLearn(body, st);
  else if (tab === 'plan') viewPlan(body, st);
  else if (tab === 'lab') LABS[st.lab](body);
  else viewPractice(body, st);
}
function planHTML(st, opts = {}) {
  const P = PLANS[st.id]; if (!P) return '';
  return '<div class="plan"><p class="plan-why"><b>The job:</b> ' + P.why + '</p>' +
    P.moves.map(m => '<section class="move"><h3>' + m.t + '</h3><ol>' + m.s.map(x => '<li>' + x + '</li>').join('') + '</ol></section>').join('') +
    '<div class="box ex"><span class="eyebrow">Exam-style example, worked</span><div class="q">' + P.ex.q + '</div><div class="ex-a">' + P.ex.a + '</div></div>' +
    '<div class="box trap"><span class="eyebrow">Where points get lost</span><ul>' + P.traps.map(t => '<li>' + t + '</li>').join('') + '</ul></div>' +
    (opts.compact ? '' : '') + '</div>';
}
function viewPlan(body, st) {
  body.innerHTML = planHTML(st) + '<div class="nextbar"><button type="button" class="btn ghost" data-tabgo="learn">Back to the lesson</button><button type="button" class="btn accent" data-five="1">Try 5 problems →</button></div>';
  body.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.five) startSet('sec', st); else if (b.dataset.tabgo) go({ v: 'st', id: st.id, tab: b.dataset.tabgo }); });
}
function viewPlans(main) {
  main.innerHTML = '<section class="hero"><span class="eyebrow">Exam tools</span><h1>Game plans</h1><p>How to get points on any problem. Read the six habits once, then open just the section you need.</p></section>' +
    '<div class="habits">' + EXAM_HABITS.map(([t, d], i) => '<div class="habit"><span class="hn">' + (i + 1) + '</span><div><b>' + t + '</b><p>' + d + '</p></div></div>').join('') + '</div>' +
    '<h2 class="h-sec">By section</h2><div class="plist">' + STATIONS.map(st => '<details class="pdet" name="gp"><summary><span class="sn">' + st.num + '</span>' + st.name + '</summary>' + planHTML(st) + '<div class="row" style="margin-top:12px"><button type="button" class="btn ghost sm" data-st="' + st.id + '">Open §' + st.num + '</button><button type="button" class="btn accent sm" data-five="' + st.id + '">Try 5 problems</button></div></details>').join('') + '</div>';
  main.addEventListener('click', e => { const b = e.target.closest('[data-st],[data-five]'); if (!b) return; if (b.dataset.five) startSet('sec', stById(b.dataset.five)); else go({ v: 'st', id: b.dataset.st, tab: 'learn' }); });
}

/* ---------- mock exams and short sets ---------- */
const RUN_TITLES = { hw: 'Professor’s picks exam', mix: 'Mixed run', ch5: 'Chapter 5 check', q3: 'Quiz 3 fake quiz', quick: 'Low-battery set', sec: 'Section set' };
const runTitle = R => (RUN_TITLES[R.mode] || 'Practice run') + (R.mode === 'sec' && R.sec && stById(R.sec) ? ' · §' + stById(R.sec).num : '');
function buildRun(mode, keysOverride) {
  const r = rng((Date.now() & 0xffffff) + 7);
  if (keysOverride) return { mode, keys: keysOverride, i: 0, res: {}, t0: Date.now(), retry: true, sec: S.run && S.run.sec };
  if (mode === 'hw') {
    S.hwSeen = S.hwSeen || {};
    const keys = HW_SECS.filter(sec => HW_POOL[sec] && HW_POOL[sec].length).map(sec => {
      const pool = HW_POOL[sec]; let fresh = pool.filter(k => !S.hwSeen[k]);
      if (!fresh.length) { pool.forEach(k => delete S.hwSeen[k]); fresh = pool.slice(); }
      const k = fresh[Math.floor(r() * fresh.length)]; S.hwSeen[k] = 1; return k;
    });
    return { mode, keys, i: 0, res: {}, t0: Date.now() };
  }
  const eligible = it => !['write', 'gbuild', 'relabel', 'eetable'].includes(it.type);
  if (mode === 'q3') {
    const items = stById('indir').items.filter(eligible);
    const take = (pool, n) => { const out = []; pool = pool.slice(); while (out.length < n && pool.length) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0].key); return out; };
    const keys = take(items.filter(it => it.type === 'fill' || it.type === 'parsons'), 2).concat(take(items.filter(it => it.type !== 'fill' && it.type !== 'parsons'), 4));
    for (let i = keys.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
    return { mode, keys, i: 0, res: {}, t0: Date.now() };
  }
  if (mode === 'ch5') {
    const keys = [];
    CH5.forEach(id => { const pool = stById(id).items.filter(eligible).map(it => it.key); for (let n = 0; n < 4 && pool.length; n++) keys.push(pool.splice(Math.floor(r() * pool.length), 1)[0]); });
    for (let i = keys.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
    return { mode, keys, i: 0, res: {}, t0: Date.now() };
  }
  const chosen = [];
  STATIONS.forEach(st => { const pool = st.items.filter(eligible); chosen.push(pool[Math.floor(r() * pool.length)].key); });
  const rest = ALL_ITEMS.filter(it => eligible(it) && !chosen.includes(it.key));
  while (chosen.length < 15) chosen.push(rest.splice(Math.floor(r() * rest.length), 1)[0].key);
  for (let i = chosen.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [chosen[i], chosen[j]] = [chosen[j], chosen[i]]; }
  return { mode, keys: chosen, i: 0, res: {}, t0: Date.now() };
}
function viewRun(main) {
  if (!S.run || S.run.done) {
    const seen = Object.keys(S.hwSeen || {}).length;
    const feat = (mode, eb, h, p, btn, cls) => '<div class="card feature"><div><span class="eyebrow">' + eb + '</span><h2>' + h + '</h2><p class="muted" style="margin:4px 0 0">' + p + '</p></div><button type="button" class="btn ' + (cls || 'ghost') + '" data-start="' + mode + '">' + btn + '</button></div>';
    main.innerHTML = '<section class="hero"><span class="eyebrow">Exam simulation</span><h1>Mock exam</h1><p>Answer like it’s the real exam. A question counts only if you get it on the <b>first try</b> without opening the solution. Proofs and written answers are checked by Claude or by you.</p></section>' +
      (S.run && S.run.done ? runResults(S.run) : '') +
      '<div class="stack">' + feat('q3', 'Thursday', 'Quiz 3 fake quiz', '6 questions from §4.7–4.8, including 2 proofs. About 12 minutes, like the real one.', 'Start', 'accent') +
      feat('ch5', 'Chapter 5', 'Chapter 5 check', '8 questions from 5.1 and 5.2. About 20 minutes.', 'Start') +
      feat('hw', 'Cumulative', 'Professor’s picks exam', 'One question from every section, 1.2 through 5.2, drawn from versions of the problems you were assigned. Each run picks ones you haven’t seen. <b>' + seen + ' of ' + HW_TOTAL + '</b> seen so far.', 'Start') +
      feat('mix', 'Wider mix', 'Mixed run', '15 questions from all ' + ALL_ITEMS.length + ', at least one per section.', 'Start') + '</div>';
    main.addEventListener('click', e => {
      const b = e.target.closest('[data-start],[data-review],[data-retry]'); if (!b) return;
      if (b.dataset.start) { const m = b.dataset.start; if (m === 'quick' || m === 'sec') { startSet(m, S.run && S.run.sec ? stById(S.run.sec) : null); return; } S.run = buildRun(m); save(); render(); window.scrollTo({ top: 0 }); }
      else if (b.dataset.retry) { const missed = S.run.keys.filter(k => !S.run.res[k]); S.run = buildRun(S.run.mode, missed); save(); render(); window.scrollTo({ top: 0 }); }
      else if (b.dataset.review) { const [st, i] = b.dataset.review.split(':'); go({ v: 'st', id: st, tab: 'practice', item: +i }); }
    });
    return;
  }
  const R = S.run; const key = R.keys[R.i]; const it = itemByKey(key);
  const score = Object.values(R.res).filter(Boolean).length;
  main.innerHTML = '<div class="p-head"><span class="eyebrow">' + runTitle(R) + (R.retry ? ' · retry' : '') + ' · question ' + (R.i + 1) + ' of ' + R.keys.length + ' · §' + secOf(it) + '</span><span class="chip">' + score + ' / ' + Object.keys(R.res).length + ' first try</span></div><div class="prog" style="margin-bottom:12px"><i style="width:' + (R.i / R.keys.length * 100) + '%;background:var(--hl)"></i></div><div id="ritem"></div><div class="nextbar"><button type="button" class="btn ghost" id="run-quit">' + (R.mode === 'quick' || R.mode === 'sec' ? 'Stop here' : 'End and grade') + '</button><button type="button" class="btn" id="run-next">' + (R.i === R.keys.length - 1 ? 'Finish' : 'Next question →') + '</button></div>';
  const runIt = Object.assign({}, it, { key: 'run:' + it.key });
  renderItem($('#ritem', main), runIt, { exam: true, onDone: first => { if (!(key in R.res)) { R.res[key] = first; save(); } }, onFirstMiss: () => { if (!(key in R.res)) { R.res[key] = false; save(); } } });
  const sb = $('#ritem .item-actions button', main); if (sb) sb.addEventListener('click', () => { if (!(key in R.res)) { R.res[key] = false; save(); } });
  $('#run-next', main).addEventListener('click', () => { if (!(key in R.res)) R.res[key] = false; if (R.i < R.keys.length - 1) R.i++; else finishRun(); save(); render(); window.scrollTo({ top: 0 }); });
  $('#run-quit', main).addEventListener('click', () => { R.keys = R.keys.slice(0, Math.max(1, Object.keys(R.res).length || R.i + 1)); R.keys.forEach(k => { if (!(k in R.res)) R.res[k] = false; }); finishRun(); save(); render(); window.scrollTo({ top: 0 }); });
}
function finishRun() { const R = S.run; R.done = true; const n = Object.values(R.res).filter(Boolean).length; R.pct = Math.round(n / R.keys.length * 100); R.mins = Math.max(1, Math.round((Date.now() - R.t0) / 60000)); if (!R.retry && (R.mode === 'hw' || R.mode === 'mix' || R.mode === 'ch5')) S.runBest = Math.max(S.runBest || 0, R.pct); }
function runResults(R) {
  const n = Object.values(R.res).filter(Boolean).length, missed = R.keys.filter(k => !R.res[k]);
  const small = R.mode === 'quick' || R.mode === 'sec';
  const rows = R.keys.map((k, i) => { const it = itemByKey(k); const ok = R.res[k]; return '<div class="rr ' + (ok ? 'ok' : 'bad') + '"><span class="mk2">' + (ok ? '✓' : '✗') + '</span><span><b>' + (i + 1) + '. §' + secOf(it) + '</b> <span class="muted">' + (it.hw ? 'Like HW ' + esc(it.hw) + ' · ' : '') + TYPE_NAME[it.type] + '</span></span><button type="button" class="btn ghost sm" data-review="' + k + '">' + (ok ? 'Redo' : 'Review') + '</button></div>'; }).join('');
  const msg = small ? (missed.length ? n + ' of ' + R.keys.length + ' on the first try. Open each ✗ and read its worked solution. That is studying too.' : 'All ' + R.keys.length + ' on the first try. That’s enough for now, or do one more set.')
    : R.pct >= 90 ? 'That’s A territory. Run it again: every section gets a fresh question.' : R.pct >= 80 ? 'That’s a B. Review the ✗ ones, then retry just those.' : R.pct >= 70 ? 'Close to a B. Each ✗ opens with its worked solution. Read it, then retry the missed ones.' : 'This is exactly why you practice now. Open each ✗, read the worked solution, then retry the missed ones.';
  return '<div class="card stack" style="margin-bottom:16px"><span class="eyebrow">' + runTitle(R) + (R.retry ? ' · retry' : '') + ' · done</span><div class="row" style="gap:18px;align-items:end"><span class="score">' + (small ? n + '/' + R.keys.length : R.pct + '%') + '</span>' + (small ? '' : '<span class="grade">' + letter(R.pct) + '</span>') + '<span class="muted">' + n + ' of ' + R.keys.length + ' on the first try · about ' + R.mins + ' min</span></div><p style="margin:0">' + msg + '</p><div class="rlist">' + rows + '</div>' +
    '<div class="row">' + (missed.length ? '<button type="button" class="btn accent" data-retry="1">Retry the ' + missed.length + ' I missed</button>' : '') + '<button type="button" class="btn' + (missed.length ? ' ghost' : ' accent') + '" data-start="' + R.mode + '">' + (small ? 'Another 5' : 'New shuffle') + '</button></div></div>';
}

/* ---------- focus mode + break nudges ---------- */
function hud() { const f = $('#focusBtn'); if (f) f.setAttribute('aria-pressed', S.focus ? 'true' : 'false'); document.body.classList.toggle('focus', !!S.focus); }
$('#focusBtn').addEventListener('click', () => { S.focus = !S.focus; save(); hud(); toast(S.focus ? 'Focus on: just the work' : 'Focus off'); });
(function breaks() {
  document.body.insertAdjacentHTML('beforeend', '<div id="nudge" class="nudge" role="status" hidden><span>You’ve been at it about 25 minutes. A 5-minute break helps it stick, and your place is saved.</span><div class="row"><button type="button" class="btn sm accent" id="nudge-go">Take 5</button><button type="button" class="btn sm ghost" id="nudge-no">Keep going</button></div></div>' +
    '<div id="brk" class="brk" hidden><div class="brk-in"><span class="eyebrow">Break</span><div class="clock" id="brk-clock">5:00</div><p>Stand up. Drink some water. Look at something far away.</p><p class="muted">Your place is saved.</p><button type="button" class="btn" id="brk-done">I’m back</button></div></div>');
  let active = 0, limit = 25, shown = false, tick = null;
  setInterval(() => { if (document.hidden || shown) return; active++; if (active >= limit) { shown = true; $('#nudge').hidden = false; } }, 60000);
  const reset = mins => { active = 0; limit = mins; shown = false; $('#nudge').hidden = true; };
  $('#nudge-no').addEventListener('click', () => reset(20));
  $('#nudge-go').addEventListener('click', () => {
    $('#nudge').hidden = true; $('#brk').hidden = false; let left = 300; const clk = $('#brk-clock');
    const show = () => { clk.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
    show(); clearInterval(tick); tick = setInterval(() => { left--; show(); if (left <= 0) { clearInterval(tick); clk.textContent = 'Done'; } }, 1000);
  });
  $('#brk-done').addEventListener('click', () => { clearInterval(tick); $('#brk').hidden = true; reset(25); });
})();

/* ---------- boot ---------- */
$('#brand').addEventListener('click', () => go({ v: 'home' }));
render();

</script>
<script>
/* Offline: cache the whole app the first time it opens with internet. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      navigator.serviceWorker.ready.then(function () {
        var said = false;
        try { said = localStorage.getItem('discrete-lab-offline') === '1'; } catch (e) {}
        if (!said && !hadController) {
          try { localStorage.setItem('discrete-lab-offline', '1'); } catch (e) {}
          if (typeof toast === 'function') toast('Saved for offline ✓');
        }
      });
    }).catch(function () {});
  });
})();
</script>
