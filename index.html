<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discrete Lab</title>
<meta name="description" content="Discrete math study lab: sets, graphs, logic, proofs, sequences and induction. Works offline.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Discrete Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
</head>
<body>
<style>
:root {
  /* Single light look on purpose: always white, even when the device is in dark mode. Layout: a sticker notebook on plain white. One column, one task at a time; chunky outlined cards, a little vertex mascot on the home screen. */
  --paper: #ffffff; --grid: transparent; --card: #ffffff; --sunk: #fff7fa; --ink: #38223f; --muted: #76617e; --line: #efc7d8; --outline: #38223f;
  --pen: #1f6fb8; --pen-soft: #e3f1ff; --hl: #d92e6b; --hl-soft: #ffe0ec; --on-hl: #ffffff;
  --good: #0b7657; --good-soft: #d7f6ea; --bad: #b42339; --bad-soft: #ffe1e5; --warn: #8a5a00; --warn-soft: #fff1c2;
  --butter: #ffc83a; --butter-soft: #fff1c2; --mint: #17a47d; --sky: #3f9beb; --coral: #e4485e;
  --obj-blue: #2f6fe0; --obj-gray: #a3abbb; --obj-black: #20263a; --obj-ink: #ffffff; --obj-stroke: #121c36;
  --b0: #3f9beb; --b1: #d92e6b; --b2: #17a47d; --b3: #e08a00;
  --shadow: 4px 4px 0 var(--outline);
  --f-display: 'Bagel Fat One', 'Baloo 2', ui-rounded, system-ui, sans-serif;
  --f-body: 'Baloo 2', ui-rounded, 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Cambria Math', 'Segoe UI Symbol', monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; font: 16px/1.55 var(--f-body);
  background-attachment: fixed; -webkit-font-smoothing: antialiased;
}
m { font-family: var(--f-mono); font-size: .9em; letter-spacing: -.01em; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0 0 .7em; }
p:last-child { margin-bottom: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.eyebrow { font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 12px; height: 58px; max-width: 1240px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px; border-radius: 10px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font: 800 20px var(--f-display); letter-spacing: -.02em; }
.hud { margin-left: auto; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.hud .pill { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font: 600 13px var(--f-body); white-space: nowrap; }
.hud .pill b { font-family: var(--f-mono); }
.lvlbar { width: 64px; height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.lvlbar i { display: block; height: 100%; background: var(--hl); border-radius: 6px; transition: width .4s; }
.streak.hot { border-color: var(--hl); color: var(--hl); }
@media (max-width: 560px) { .hud .xp-l, .lvlbar { display: none; } .brand b { font-size: 18px; } }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 32px; max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 80px; }
main { min-width: 0; max-width: 880px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; padding-right: 4px; }
.rail ol { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 2px; }
.rail .sep { height: 10px; }
.rail .edge { position: absolute; left: 17px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.rail button { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 5px 8px 5px 2px; border: 0; background: none; border-radius: 10px; cursor: pointer; }
.rail button:hover { background: var(--card); }
.rail button[aria-current="true"] { background: var(--card); box-shadow: var(--shadow); }
.vx { --p: 0; width: 32px; height: 32px; flex: none; border-radius: 50%; background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.vx span { width: 24px; height: 24px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font: 700 9.5px var(--f-mono); letter-spacing: -.03em; }
button[aria-current="true"] .vx span { background: var(--hl); color: var(--on-hl); }
.rail .nm { font: 600 14px/1.2 var(--f-body); }
.rail .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 72px; }
  .rail { position: static; max-height: none; overflow: visible; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-right: 0; }
  .rail ol { display: flex; overflow-x: auto; gap: 6px; padding: 4px 16px 8px 2px; scrollbar-width: none; }
  .rail .edge, .rail .sep, .rail .nm small { display: none; }
  .rail li { flex: none; }
  .rail button { padding: 4px 10px 4px 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
  .rail .vx { width: 28px; height: 28px; } .rail .vx span { width: 21px; height: 21px; }
  .rail .nm { font-size: 13px; white-space: nowrap; }
}

/* ---------- generic ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); min-width: 0; }
@media (max-width: 560px) { .card { padding: 18px 16px; border-radius: 14px; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 700 15px var(--f-body); border-radius: 10px; padding: 10px 16px; border: 1.5px solid transparent; background: var(--ink); color: var(--paper); cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.12); }
.btn.accent { background: var(--hl); color: var(--on-hl); }
.btn.ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--pen); filter: none; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 16px; min-width: 0; }
.muted { color: var(--muted); }
.claude-only { display: none !important; }
.has-claude .claude-only { display: inline-flex !important; }
.has-claude div.claude-only { display: block !important; }
input.txt, textarea.txt, select.txt { font: 500 16px var(--f-mono); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; max-width: 100%; }
input.txt:focus, textarea.txt:focus, select.txt:focus { border-color: var(--pen); outline: none; box-shadow: 0 0 0 3px var(--pen-soft); }
textarea.txt { width: 100%; min-height: 160px; font: 15px/1.55 var(--f-body); resize: vertical; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); font: 600 12px var(--f-mono); white-space: nowrap; }
.chip.hw { background: var(--hl-soft); border-color: transparent; color: var(--hl); font-family: var(--f-body); }
.chip.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.fb { min-height: 0; font-weight: 600; }
.fb:empty { display: none; }
.fb.ok { color: var(--good); } .fb.bad { color: var(--bad); } .fb.info { color: var(--muted); font-weight: 400; }
.box { border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.box > .eyebrow { display: block; margin-bottom: 6px; }
.box.ex { background: var(--sunk); border: 1px dashed var(--line); }
.box.trap { background: var(--hl-soft); } .box.trap > .eyebrow { color: var(--hl); }
.box.think { background: var(--pen-soft); } .box.think > .eyebrow { color: var(--pen); }
.box.sol { background: var(--good-soft); } .box.sol > .eyebrow { color: var(--good); }
.claude-out { white-space: pre-wrap; background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.claude-out.thinking { color: var(--muted); font-style: italic; }
.claude-out ul { margin: 4px 0; padding-left: 20px; }
.ovx { overflow-x: auto; max-width: 100%; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.shake { animation: shake .32s; }

/* ---------- home ---------- */
.hero { display: grid; gap: 10px; padding: 8px 0 18px; }
.hero h1 { font-size: clamp(36px, 6vw, 58px); font-weight: 800; letter-spacing: -.035em; }
.hero h1 em { font-style: normal; color: var(--hl); }
.hero p { font-size: 18px; color: var(--muted); max-width: 60ch; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 6px 0 22px; }
.how div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.how b { display: block; font: 700 16px var(--f-display); margin-bottom: 2px; }
.how span { font-size: 14px; color: var(--muted); }
.how i { font: 700 12px var(--f-mono); color: var(--hl); font-style: normal; display: block; margin-bottom: 6px; }
@media (max-width: 620px) { .how { grid-template-columns: minmax(0, 1fr); } }
.stgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .stgrid { grid-template-columns: minmax(0, 1fr); } }
.stcard { display: grid; gap: 8px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }
.stcard:hover { border-color: var(--pen); }
.stcard .n { font: 800 26px/1 var(--f-display); color: var(--hl); letter-spacing: -.02em; }
.stcard h3 { font-size: 17px; }
.stcard p { font-size: 14px; color: var(--muted); margin: 0; }
.prog { height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--good); border-radius: 6px; }
.stcard .meta { display: flex; justify-content: space-between; font: 600 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.feature { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; margin-bottom: 14px; }
.feature h2 { font-size: 22px; }
@media (max-width: 560px) { .feature { grid-template-columns: minmax(0, 1fr); } }

/* ---------- station ---------- */
.st-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: end; margin-bottom: 16px; }
.st-num { font: 800 clamp(44px, 8vw, 68px)/.85 var(--f-display); color: var(--hl); letter-spacing: -.04em; grid-row: span 2; }
.st-head h1 { font-size: clamp(22px, 3.4vw, 30px); letter-spacing: -.02em; }
.st-head p { margin: 0; color: var(--muted); font-size: 15px; }
@media (max-width: 560px) { .st-head { grid-template-columns: minmax(0, 1fr); } .st-num { grid-row: auto; } }
.tabs { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 16px; max-width: 100%; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; font: 700 15px var(--f-body); cursor: pointer; white-space: nowrap; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.tabs button small { font: 600 11px var(--f-mono); margin-left: 4px; color: var(--muted); }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.subtabs button { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 13px; font: 600 14px var(--f-body); cursor: pointer; }
.subtabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* lesson deck */
.deck-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots button { width: 22px; height: 8px; border-radius: 6px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.dots button.seen { background: var(--pen); opacity: .45; }
.dots button.ok { background: var(--good); opacity: 1; }
.dots button[aria-current="true"] { background: var(--hl); opacity: 1; width: 30px; }
.lesson { display: grid; gap: 14px; }
.lesson h2 { font-size: clamp(22px, 3.2vw, 28px); letter-spacing: -.02em; }
.lesson .body { font-size: 17px; max-width: 66ch; }
.deck-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.quick { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.mini-table { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: 4px 18px; font: 14px var(--f-mono); margin-top: 6px; }
.mini-table.three { grid-template-columns: repeat(3, 3.5em); } .mini-table.four { grid-template-columns: repeat(4, 3.8em); }
.mini-table.three div, .mini-table.four div { text-align: center; }
.laws { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.laws div { background: var(--sunk); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; font-size: 14px; }
.laws m { font-size: 13px; }
@media (max-width: 560px) { .laws { grid-template-columns: minmax(0, 1fr); } }
.figlist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.figlist b { width: 100%; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.figlist span { padding: 4px 10px; background: var(--sunk); border-radius: 999px; font-size: 14px; }
.figpair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.askrow { display: grid; gap: 8px; }
.askrow .row input { flex: 1 1 220px; font-family: var(--f-body); }

/* practice */
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.p-dots { display: flex; flex-wrap: wrap; gap: 4px; }
.p-dots button { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); padding: 0; cursor: pointer; }
.p-dots button.ok { background: var(--good); border-color: var(--good); }
.p-dots button.seen { border-color: var(--pen); }
.p-dots button[aria-current="true"] { box-shadow: 0 0 0 3px var(--hl-soft); border-color: var(--hl); }
.item { display: grid; gap: 14px; }
.item-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item .q { font-size: 17px; }
.opts { display: grid; gap: 8px; }
.opt { display: block; width: 100%; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); font: 16px/1.45 var(--f-body); cursor: pointer; }
.opt:hover { border-color: var(--pen); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); opacity: .75; }
.opt.on { border-color: var(--pen); background: var(--pen-soft); }
.opt.miss { border-style: dashed; border-color: var(--good); }
.tf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 360px; }
.tf .opt { text-align: center; font-weight: 700; }
.ansrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ansrow label { font: 600 14px var(--f-mono); }
.ansrow input.txt { width: 9em; }
.ansrow input.wide { width: min(100%, 22em); }
.item-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.nextbar { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }

/* logic input */
.li { display: grid; gap: 8px; }
.li input.txt { width: 100%; font-size: 18px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { min-width: 40px; height: 38px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--card); font: 600 17px var(--f-mono); cursor: pointer; }
.keys button:hover { border-color: var(--pen); }
.li-prev { font: 14px var(--f-mono); color: var(--muted); min-height: 1.4em; }
.li-prev.err { color: var(--bad); font-family: var(--f-body); }

/* truth table */
.tt-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
table.tt { border-collapse: collapse; font-family: var(--f-mono); margin: 0; }
table.tt th { font-weight: 600; font-size: 13px; padding: 9px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; text-align: center; }
table.tt td { padding: 3px 5px; text-align: center; border-bottom: 1px solid var(--line); }
table.tt tr:last-child td { border-bottom: 0; }
table.tt .vsep { border-right: 2px solid var(--line); }
table.tt td.var { color: var(--muted); font-weight: 600; }
table.tt th.src { background: var(--pen-soft); color: var(--pen); }
table.tt th.cur { background: var(--hl-soft); color: var(--hl); }
table.tt th.final { box-shadow: inset 0 -4px 0 var(--hl); }
table.tt tr.diff td { background: var(--warn-soft); }
.cell { width: 40px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); font: 700 15px var(--f-mono); cursor: pointer; padding: 0; }
.cell.T, td.var.T { color: var(--pen); } .cell.F, td.var.F { color: var(--hl); }
td.src .cell, td.src.var { outline: 2.5px solid var(--pen); outline-offset: -2px; border-radius: 8px; background: var(--pen-soft); }
.cell.ok { background: var(--good-soft); border-color: var(--good); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); }
.cell.ro { cursor: default; border-color: transparent; background: transparent; }
.tt-cap { font-size: 14px; color: var(--muted); min-height: 1.5em; }
.tt-cap b { color: var(--ink); }
.verdict { font-weight: 700; }

/* graph */
.gv { display: grid; gap: 10px; min-width: 0; }
.gv-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 7px 12px; font: 600 14px var(--f-body); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tog { display: inline-flex; gap: 6px; align-items: center; font: 600 14px var(--f-body); cursor: pointer; }
.gv-hint { font-size: 14px; color: var(--muted); }
.gv-box { background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.gv-svg { width: 100%; height: auto; display: block; }
.gv-edit .gv-svg, .gv-pick .gv-svg { touch-action: none; }
.gv-edit .gv-svg { cursor: crosshair; }
.nd { cursor: pointer; }
.nd circle { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.nd text { font: 700 12px var(--f-mono); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.nd.adj circle { stroke: var(--hl); stroke-width: 3.5; fill: var(--hl-soft); }
.nd.sel circle, .nd.pick circle { fill: var(--hl); stroke: var(--hl); }
.nd.sel text, .nd.pick text { fill: var(--on-hl); }
.nd.pend circle { stroke: var(--pen); stroke-width: 3.5; stroke-dasharray: 5 3; }
.nd.unl circle { stroke-dasharray: 3 3; }
.ed .ln { fill: none; stroke: var(--ink); stroke-width: 2; }
.ed .hit { fill: none; stroke: transparent; stroke-width: 18; cursor: pointer; }
.ed .el { font: 700 12px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: var(--sunk); stroke-width: 4px; text-anchor: middle; pointer-events: none; }
.ed.inc .ln, .ed.sel .ln, .ed.pick .ln { stroke: var(--hl); stroke-width: 4; }
.ed.inc .el, .ed.sel .el, .ed.pick .el { fill: var(--hl); }
.ed.adj .ln { stroke: var(--pen); stroke-width: 3.5; }
.ed.adj .el { fill: var(--pen); }
.mk { fill: var(--ink); } .mk.hi { fill: var(--hl); }
.gv-info { display: grid; gap: 10px; font-size: 14px; }
.gv-info .kv { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.gv-info .kv > span:first-child { color: var(--muted); font-weight: 600; }

.eef { border-collapse: collapse; font: 13px var(--f-mono); }
.eef th, .eef td { padding: 4px 12px 4px 0; text-align: left; border-bottom: 1px solid var(--line); }
.eef th { font-family: var(--f-body); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.inspect { background: var(--hl-soft); border-radius: 10px; padding: 10px 12px; }

.lab-split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .lab-split { grid-template-columns: minmax(0, 1fr); } }

/* missions */
.missions { display: grid; gap: 6px; }
.mission { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 14.5px; }
.mission .st { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 700 12px var(--f-body); margin-top: 1px; }
.mission.done { border-color: var(--good); background: var(--good-soft); }
.mission.done .st { background: var(--good); border-color: var(--good); color: var(--card); }
.mission .row { margin-top: 6px; }

/* tarski */
.tw { display: grid; gap: 10px; }
.tw-svg { width: 100%; max-width: 480px; height: auto; display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; touch-action: manipulation; }
.tw-svg .cl { fill: var(--card); stroke: var(--line); stroke-width: 1; }
.tw-svg .ob { cursor: pointer; }
.tw-svg .ob .sh { stroke: var(--obj-stroke); stroke-width: 1.2; }
.tw-svg .ob.blue .sh { fill: var(--obj-blue); } .tw-svg .ob.gray .sh { fill: var(--obj-gray); } .tw-svg .ob.black .sh { fill: var(--obj-black); }
.tw-svg .ob text { font: 700 13px var(--f-mono); text-anchor: middle; fill: var(--obj-ink); pointer-events: none; }
.tw-svg .ob.gray text { fill: #121c36; }
.tw-svg .ring { fill: none; stroke: var(--hl); stroke-width: 3.5; }
.tw-svg .selring { fill: none; stroke: var(--pen); stroke-width: 3; stroke-dasharray: 5 4; }
.tw-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tw-tools .sw { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font: 700 16px var(--f-mono); }
.tw-tools .sw.c { border-width: 3px; }
.stmts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.stmts li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
.stmts li::before { content: "#" counter(s); font: 700 12px var(--f-mono); color: var(--muted); }
.stmts .sy { font: 14px var(--f-mono); overflow-wrap: anywhere; }
.stmts .en { grid-column: 2 / -1; font-size: 14px; color: var(--muted); }
.stmts .why { grid-column: 1 / -1; font-size: 14px; background: var(--hl-soft); border-radius: 8px; padding: 8px 10px; }
.tv { font: 700 12px var(--f-mono); padding: 4px 9px; border-radius: 999px; }
.tv.T { background: var(--good-soft); color: var(--good); } .tv.F { background: var(--bad-soft); color: var(--bad); }
.flash { animation: flash .6s; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--hl); } 100% { box-shadow: 0 0 0 10px transparent; } }

/* relation grid */
table.rg { border-collapse: separate; border-spacing: 4px; font: 600 13px var(--f-body); }
table.rg th { font-weight: 600; color: var(--muted); padding: 2px 6px; }
table.rg td { padding: 0; }
.rgc { width: 46px; height: 40px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font: 700 18px var(--f-mono); color: var(--good); }
.rgc.on { background: var(--good-soft); border-color: var(--good); }
.rgc.ro { cursor: default; }
table.rg tr.hlr .rgc, table.rg td.hlc .rgc { box-shadow: 0 0 0 2.5px var(--hl); }
table.rg tr.badr th, table.rg th.badc { color: var(--bad); }

/* parsons */
.pz { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 700px) { .pz { grid-template-columns: minmax(0, 1fr); } }
.pz h4 { margin: 0 0 6px; font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.pz ol, .pz ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; min-height: 60px; }
.pz .zone { background: var(--sunk); border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px; }
.pline { display: block; width: 100%; text-align: left; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font: 14.5px/1.45 var(--f-body); cursor: pointer; }
.pline:hover { border-color: var(--pen); }
.pline.ok { border-color: var(--good); background: var(--good-soft); }
.pline.bad { border-color: var(--bad); background: var(--bad-soft); }

.pz ol.bo { counter-reset: pl; }
.pz ol .pline::before { counter-increment: pl; content: counter(pl) ". "; font: 700 12px var(--f-mono); color: var(--muted); }
.thm { font-size: 16px; }

/* fill */
.fill { font-size: 16px; line-height: 2.2; }
.fill input.blank { font: 600 15px var(--f-mono); width: 9em; padding: 3px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.fill select.blank { font: 15px var(--f-body); padding: 3px 6px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); max-width: 100%; }

.fill .blank.bad { border-color: var(--bad); background: var(--bad-soft); }

/* labs: sets, div, qr */

.form-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }

.form-grid input.txt, .form-grid select.txt { width: 8em; }
.eq-big { font: 600 clamp(18px, 3vw, 24px) var(--f-mono); letter-spacing: -.02em; overflow-wrap: anywhere; }
.eq-big .r { color: var(--hl); } .eq-big .q { color: var(--pen); }
.dots-grid { display: grid; gap: 6px; }
.dots-grid .drow { display: flex; gap: 5px; align-items: center; }
.dots-grid .drow span { width: 14px; height: 14px; border-radius: 50%; background: var(--pen); }
.dots-grid .drow.left span { background: var(--hl); }
.dots-grid .drow small { font: 12px var(--f-mono); color: var(--muted); margin-left: 6px; }
.cg { border-collapse: separate; border-spacing: 4px; font: 13px var(--f-mono); }
.cg th { color: var(--muted); font-weight: 700; padding: 4px; }
.cg td button { padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); font: 600 13px var(--f-mono); cursor: pointer; white-space: nowrap; }

.es th, .es td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: center; }

.es td:first-child { text-align: left; font-weight: 600; }
.es .tg { min-width: 54px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font: 700 13px var(--f-body); }
.es .tg.y { border-color: var(--pen); color: var(--pen); }

.es .tg.bad { background: var(--bad-soft); border-color: var(--bad); }

.ft { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: max-content; padding: 8px; }
.ft-node { display: flex; flex-direction: column; align-items: center; }

.ft-v { min-width: 50px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font: 700 15px var(--f-mono); cursor: pointer; }
.ft-v.prime { background: var(--good-soft); border-color: var(--good); color: var(--good); cursor: default; }

.buckets { display: flex; flex-wrap: wrap; gap: 4px; }

.buckets .k0 { background: var(--b0); } .buckets .k1 { background: var(--b1); } .buckets .k2 { background: var(--b2); } .buckets .k3 { background: var(--b3); }
:root[data-theme="dark"] .buckets span { color: #0c1222; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .buckets span { color: #0c1222; } }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font: 600 13px var(--f-mono); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
.neg-steps { display: grid; gap: 8px; }
.neg-step { padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); }
.neg-step .f { font: 15px var(--f-mono); overflow-wrap: anywhere; }

@keyframes slidein { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
.chain { display: grid; gap: 6px; }
.chain .cl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 13em); gap: 10px; align-items: center; padding: 8px 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; }

.chain select.ok { border-color: var(--good); background: var(--good-soft); } .chain select.bad { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 520px) { .chain .cl { grid-template-columns: minmax(0, 1fr); } }
.slots { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 16px; line-height: 2; }
.slot { min-width: 9em; min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 2px dashed var(--line); background: var(--sunk); display: inline-flex; align-items: center; cursor: pointer; font: 15px var(--f-body); }

.slot.ok { border-color: var(--good); background: var(--good-soft); } .slot.bad { border-color: var(--bad); background: var(--bad-soft); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font: 15px var(--f-body); text-align: left; }
.tile b { font-family: var(--f-mono); color: var(--hl); margin-right: 6px; }
.tile:hover { border-color: var(--pen); }
.exh { border-collapse: collapse; width: 100%; font-size: 15px; }
.exh td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.exh td:first-child { font: 700 15px var(--f-mono); width: 3.5em; }
.exh input { width: 100%; max-width: 14em; font: 15px var(--f-mono); padding: 5px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }

.exh tr.bad input { border-color: var(--bad); background: var(--bad-soft); }
.exh .m { font-size: 13px; color: var(--muted); }

/* review + run */
.rv { display: grid; gap: 12px; }
.rv section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.rv h3 { font-size: 18px; display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }

.bk { display: grid; gap: 6px; }
.bk div { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }

/* toast + sparks */
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font: 700 14px var(--f-body); z-index: 70; transition: .25s; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }
.spark { position: fixed; z-index: 65; pointer-events: none; font: 700 15px var(--f-mono); color: var(--hl); animation: spark .9s ease-out forwards; }
.spark:nth-child(3n) { color: var(--pen); } .spark:nth-child(3n+1) { color: var(--good); }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.grade { font: 800 40px/1 var(--f-display); color: var(--ink); letter-spacing: -.03em; }
.rlist { display: grid; gap: 6px; }
.rr { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 14.5px; }

.rr.ok .mk2 { color: var(--good); } .rr.bad .mk2 { color: var(--bad); }
.skchips { display: flex; flex-wrap: wrap; gap: 6px; }
.skchip { font: 600 12px var(--f-mono); padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); }

.skchip.on { background: var(--hl); border-color: var(--hl); color: var(--on-hl); }
.skproof { display: grid; gap: 4px; align-content: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 220px; min-width: 0; }
.skline { padding: 8px 10px; border-radius: 10px; font-size: 15px; line-height: 1.55; border: 1.5px solid transparent; }
.skline.new { background: var(--hl-soft); border-color: var(--hl); }
.sknum { display: inline-block; min-width: 20px; font: 700 12px var(--f-mono); color: var(--muted); }
.sk-k { color: var(--pen); font-family: var(--f-mono); font-size: .92em; }
.sk-g { color: var(--good); font-family: var(--f-mono); font-size: .92em; }
.sk-trap:empty { display: none; }
.sk-trap { font-size: 14px; }
.rv #rv-skel > .card { box-shadow: none; padding: 0; border: 0; }

body:not(.has-voice) .voice-only { display: none !important; }

.vrow { margin-top: -4px; }
.reading { box-shadow: 0 0 0 3px var(--hl); border-radius: 10px; background-color: var(--hl-soft); transition: box-shadow .2s, background-color .2s; }
.opt.reading { background-color: var(--hl-soft); }
.vox-wrap { position: relative; }

.vox-panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(300px, calc(100vw - 32px)); display: grid; gap: 8px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.vox-panel label { font: 600 13px var(--f-body); color: var(--muted); }

@media (max-width: 560px) { .hud .lvl-pill, .vox-l { display: none; } .hud { gap: 6px; } }

[hidden] { display: none !important; }

.cram-map { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 620px) { .cram-map { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.clock { font: 800 30px/1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.clock.low { color: var(--bad); }
.cq-head { display: flex; gap: 14px; align-items: center; }

.cram.exam-on .cq-reveal, .cram.exam-on .cq-pattern, .cram.exam-on .cq-mark, .cram.exam-on .twin, .cram.exam-on .cq-ans { display: none !important; }

.cmap.pbchip { border-color: var(--pen); } .cmap.pbchip b { color: var(--pen); }
.ttb-pal { display: flex; flex-wrap: wrap; gap: 6px; }
.tile2 { min-width: 44px; height: 44px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font: 700 20px var(--f-mono); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; color: var(--ink); }

/* ===================== Calm layer: quieter surfaces, one task at a time ===================== */
body { background-image: none; font-size: 17px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.top { border-bottom-color: transparent; }
.top-in { height: 56px; max-width: 1120px; }
.brand b { font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.hud .pill { background: transparent; }
.hud button.pill { cursor: pointer; color: var(--ink); }
#focusBtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.shell { max-width: 1120px; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; padding-block: 16px 96px; }
main { max-width: 760px; }
.card { box-shadow: none; border-radius: 14px; }
.btn { border-radius: 10px; font-weight: 600; }
.btn.accent { background: var(--hl); }
.eyebrow { font-weight: 600; letter-spacing: .07em; }

/* rail: plain text list, small and quiet */
.rail .edge { display: none; }
.rail ol { gap: 0; }

.vx span { width: 20px; height: 20px; font-size: 8.5px; background: var(--paper); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-block: 8px 88px; }

}
body.focus .rail { display: none; }
body.focus .shell { grid-template-columns: minmax(0, 1fr); }
body.focus main { margin-inline: auto; width: 100%; }
body.focus .vrow, body.focus .askrow, body.focus .item-meta .lbtn, body.focus .back, body.focus .tabs, body.focus .deck-head .dots, body.focus .p-dots { display: none !important; }

/* back link */
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); font: 600 14px var(--f-body); padding: 6px 0; margin-bottom: 8px; cursor: pointer; }
.back:hover { color: var(--ink); }

/* headings */
.hero { padding: 6px 0 16px; gap: 8px; }
.hero h1 { font-size: clamp(28px, 4.6vw, 38px); font-weight: 600; letter-spacing: -.025em; }
.hero p { font-size: 17px; }
.st-head { margin-bottom: 18px; align-items: center; }
.st-num { font-size: clamp(36px, 6vw, 48px); font-weight: 600; }
.st-head h1 { font-weight: 600; font-size: clamp(22px, 3.2vw, 28px); }
.tabs { background: transparent; border: 0; padding: 0; gap: 2px; border-bottom: 1px solid var(--line); border-radius: 0; display: flex; margin-bottom: 20px; }
.tabs button { border-radius: 0; padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: transparent; box-shadow: none; border-bottom-color: var(--hl); }
.lesson h2 { font-weight: 600; }
.lesson .body { font-size: 17.5px; line-height: 1.65; }
.box { font-size: 16px; line-height: 1.65; }
.box.ex { border-style: solid; }

/* today (home) */
.today { display: grid; gap: 6px; padding: 12px 0 20px; }
.today h1 { font: 600 clamp(30px, 5vw, 42px)/1.1 var(--f-display); letter-spacing: -.03em; }
.today p { margin: 0; color: var(--muted); font-size: 18px; max-width: 46ch; }
.energy { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .energy { grid-template-columns: minmax(0, 1fr); } }
.etile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; color: var(--ink); font: inherit; }
.etile:hover { border-color: var(--hl); }
.etxt { display: grid; gap: 2px; min-width: 0; }
.etxt b { font: 600 17px var(--f-display); }
.emin { font: 600 12px var(--f-mono); color: var(--muted); }
.edesc { font-size: 14.5px; color: var(--muted); line-height: 1.45; margin-top: 4px; }
.ebat { width: 18px; height: 30px; border: 2px solid var(--ink); border-radius: 4px; position: relative; display: block; margin-top: 3px; }
.ebat::before { content: ""; position: absolute; top: -5px; left: 4px; width: 6px; height: 3px; background: var(--ink); border-radius: 1px; }
.ebat i { position: absolute; left: 2px; right: 2px; bottom: 2px; border-radius: 1px; background: var(--hl); }
.ebat.low i { height: 22%; } .ebat.mid i { height: 55%; } .ebat.full i { height: calc(100% - 4px); background: var(--good); }
.resume { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; column-gap: 12px; align-items: center; width: 100%; text-align: left; margin-top: 12px; padding: 14px 16px; border: 0; border-radius: 14px; background: var(--hl-soft); color: var(--ink); cursor: pointer; font: inherit; }
.resume .eyebrow { color: var(--hl); grid-column: 1; }

.resume .muted { grid-column: 1; font-size: 14px; }
.resume .go { grid-column: 2; grid-row: 1 / span 3; font-size: 22px; color: var(--hl); }
.h-sec { font: 600 13px var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 30px 0 8px; }
.slist, .hwlist { display: grid; border-top: 1px solid var(--line); }
.srow, .hwrow { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; font: inherit; }
.srow:hover, .hwrow:hover { background: var(--sunk); }
.sn, .hwn { font: 600 14px var(--f-mono); color: var(--hl); }
.hwrow { grid-template-columns: 5.6em minmax(0, 1fr) auto; font-size: 15.5px; }
.sname { font-weight: 600; min-width: 0; }
.sname small { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.sside { display: grid; justify-items: end; gap: 5px; }
.sbar { width: 76px; height: 4px; border-radius: 4px; background: var(--sunk); overflow: hidden; display: block; }
.sbar i { display: block; height: 100%; background: var(--good); }
.scount { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font: 600 11px var(--f-body); padding: 2px 8px; border-radius: 999px; background: var(--pen-soft); color: var(--pen); white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.dim { background: var(--sunk); color: var(--muted); }
@media (max-width: 520px) { .srow { grid-template-columns: 2.8em minmax(0, 1fr); } .sside { grid-column: 2; justify-items: start; grid-auto-flow: column; align-items: center; } .sname small { display: none; } .hwrow { grid-template-columns: 4.8em minmax(0, 1fr); } .hwrow .scount { grid-column: 2; } }
.older { margin-top: 26px; }
.older summary { cursor: pointer; font-weight: 600; padding: 10px 0; list-style-position: inside; }
.older summary .muted { font-weight: 400; font-size: 14px; }
.tools { display: grid; gap: 8px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }

/* game plans */
.plan { display: grid; gap: 14px; }
.plan-why { margin: 0; font-size: 18px; }
.move { border-left: 3px solid var(--hl-soft); padding: 2px 0 2px 16px; }
.move h3 { font: 600 17px var(--f-display); margin-bottom: 6px; }
.move ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 16.5px; line-height: 1.55; }
.move li::marker { color: var(--hl); font-weight: 700; }
.ex-a { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.box.trap ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.habits { display: grid; gap: 10px; margin-bottom: 4px; }
.habit { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
.habit .hn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--hl-soft); color: var(--hl); font: 700 14px var(--f-mono); }
.habit p { margin: 2px 0 0; color: var(--muted); font-size: 15.5px; }
.plist { display: grid; border-top: 1px solid var(--line); }
.pdet { border-bottom: 1px solid var(--line); padding: 4px 0; }
.pdet summary { cursor: pointer; display: flex; gap: 12px; align-items: baseline; padding: 10px 4px; font-weight: 600; }
.pdet[open] summary { margin-bottom: 8px; }
.pdet .plan { padding: 0 4px 12px; }

/* math notation */
.mx { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; white-space: nowrap; }
.bigop { display: inline-grid; justify-items: center; line-height: 1; margin: 0 2px; vertical-align: middle; }
.bo-s { font: 400 1.6em/1 var(--f-body); }
.bo-hi, .bo-lo { font: 500 .62em/1.15 var(--f-mono); color: var(--muted); }
.anat { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; padding: 12px; background: var(--sunk); border-radius: 12px; }
.anat-sym { font-size: 26px; }
.anat ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15.5px; }
@media (max-width: 520px) { .anat { grid-template-columns: minmax(0, 1fr); } }
.tpl { line-height: 1.9; }
.dom-fig { width: 100%; max-width: 440px; height: auto; display: block; }
.dom-fig .dm { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.dom-fig .dm.f { fill: var(--hl-soft); stroke: var(--hl); }
.dom-fig .dm-t { fill: var(--muted); font: 12px var(--f-mono); }

/* labs: Σ machine + dominoes */
.lab-h { font: 600 20px var(--f-display); margin-top: 2px; }
.ctl { display: grid; gap: 6px; }
.ctl-l { font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ctl .subtabs { margin-bottom: 0; }
.stp { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.stp b { font: 700 18px var(--f-mono); min-width: 1.6em; text-align: center; }
.stp > span { color: var(--muted); }
.chk { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 15px; cursor: pointer; }
.sq-rows { display: grid; gap: 4px; }
.sq-row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 10px; padding: 6px 10px; border-radius: 8px; background: var(--sunk); font: 15px var(--f-mono); }
.sq-k { color: var(--hl); font-weight: 600; }
.sq-total { font: 16px var(--f-mono); overflow-wrap: anywhere; padding-top: 6px; }
.doms { display: flex; gap: 10px; padding: 18px 26px 18px 4px; min-width: max-content; }
.dom { width: 74px; height: 104px; flex: none; display: grid; align-content: center; justify-items: center; gap: 2px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); font: 11px var(--f-mono); color: var(--muted); transform-origin: bottom right; transition: transform .32s ease-in, background-color .2s; }
.dom b { font-size: 13px; color: var(--ink); }
.dom.fell { transform: rotate(14deg); background: var(--good-soft); border-color: var(--good); }
.dom.stuck { background: var(--bad-soft); border-color: var(--bad); }
.alg { margin: 0; padding-left: 22px; display: grid; gap: 6px; font: 15px/1.5 var(--f-mono); }
.ok-t { color: var(--good); font-weight: 700; } .bad-t { color: var(--bad); font-weight: 700; }

/* break nudge */
.nudge { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); display: grid; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--hl); box-shadow: 0 8px 30px rgba(0, 0, 0, .12); font-size: 15.5px; }
.brk { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: var(--paper); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.brk-in { display: grid; gap: 10px; justify-items: center; text-align: center; max-width: 34ch; }
.brk .clock { font-size: 56px; }
.brk p { margin: 0; }

/* ===================== Cute layer: white paper, sticker outlines, rounded type ===================== */
body { background: var(--paper); font: 500 17px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-body); font-weight: 800; letter-spacing: -.005em; }
m { font-size: .86em; }
.eyebrow { font: 800 12px/1.2 var(--f-body); letter-spacing: .08em; }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

/* top bar */
.top { background: var(--paper); border-bottom: 2.5px solid var(--outline); }
body::before { background: var(--paper); }
.brand b { font: 400 22px/1 var(--f-display); color: var(--hl); text-shadow: 2px 2px 0 var(--outline); letter-spacing: .01em; }
.brand svg { width: 32px; height: 32px; }
.hud .pill { background: var(--card); border: 2px solid var(--outline); box-shadow: 0 3px 0 var(--outline); font: 800 14px var(--f-body); padding: 4px 12px; }
#focusBtn[aria-pressed="true"] { background: var(--butter); color: var(--ink); border-color: var(--outline); }

/* cards and buttons */
.card { background: var(--card); border: 2.5px solid var(--outline); border-radius: 22px; box-shadow: 6px 6px 0 var(--outline); }
@media (max-width: 560px) { .card { box-shadow: 4px 4px 0 var(--outline); border-radius: 18px; } }
.btn { min-height: 42px; border-radius: 999px; border: 2.5px solid var(--outline); background: var(--butter); color: var(--ink); font: 800 15.5px/1 var(--f-body); padding: 9px 18px; box-shadow: 0 3px 0 var(--outline); transition: transform .1s ease, box-shadow .1s ease, background-color .15s ease; }
.btn:hover:not(:disabled) { filter: none; transform: translateY(-1px); box-shadow: 0 4px 0 var(--outline); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--outline); }
.btn.accent { background: var(--hl); color: var(--on-hl); }
.btn.ghost { background: var(--card); border-color: var(--outline); color: var(--ink); box-shadow: 0 3px 0 var(--outline); }
.btn.ghost:hover:not(:disabled) { background: var(--hl-soft); border-color: var(--outline); }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 13.5px; border-width: 2px; box-shadow: 0 2px 0 var(--outline); }
.btn:disabled { opacity: .45; box-shadow: none; }
.lbtn.on { background: var(--hl); color: var(--on-hl); }
.chip { background: var(--butter-soft); border: 2px solid var(--outline); font: 800 12.5px var(--f-body); color: var(--ink); }
.chip.hw { background: var(--hl-soft); border: 2px solid var(--outline); color: var(--ink); }
.chip.ok { background: var(--good-soft); border: 2px solid var(--outline); color: var(--ink); }
input.txt, textarea.txt, select.txt { border: 2px solid var(--outline); border-radius: 12px; background: var(--card); }
input.txt:focus, textarea.txt:focus, select.txt:focus { border-color: var(--sky); box-shadow: 0 0 0 3px var(--pen-soft); }
textarea.txt { font: 500 16px/1.55 var(--f-body); }

/* boxes inside cards */
.box { border-radius: 16px; font-size: 16px; }
.box.think { background: var(--pen-soft); border: 2px solid var(--outline); }
.box.think > .eyebrow { color: var(--pen); }
.box.ex { background: var(--sunk); border: 2px dashed var(--line); }
.box.trap { background: var(--hl-soft); border: 2px solid var(--outline); }
.box.trap > .eyebrow { color: var(--hl); }
.box.sol { background: var(--good-soft); border: 2px solid var(--outline); }
.box.sol > .eyebrow { color: var(--good); }
.claude-out { border: 2px dashed var(--line); border-radius: 14px; }
.fb { font-weight: 800; }

/* options */
.opt { border: 2.5px solid var(--outline); border-radius: 16px; background: var(--card); font: 700 16.5px/1.35 var(--f-body); box-shadow: 0 4px 0 var(--outline); transition: transform .1s ease, box-shadow .1s ease, background-color .15s ease; }
.opt:hover { border-color: var(--outline); background: var(--hl-soft); transform: translateY(-2px); box-shadow: 0 6px 0 var(--outline); }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--outline); }
.opt.ok { background: var(--good-soft); border-color: var(--outline); }
.opt.bad { background: var(--bad-soft); border-color: var(--outline); opacity: .7; }
.opt.on { background: var(--butter-soft); border-color: var(--outline); }
.tf .opt { font-weight: 800; }

/* headings */
.hero h1, .today h1 { font: 400 clamp(32px, 6.4vw, 46px)/1.05 var(--f-display); color: var(--hl); text-shadow: 3px 3px 0 var(--outline); letter-spacing: .01em; }
.hero p, .today p { color: var(--muted); font-weight: 600; }
.st-num { font: 400 clamp(38px, 7vw, 54px)/.9 var(--f-display); color: var(--hl); text-shadow: 3px 3px 0 var(--outline); }
.st-head h1 { font-weight: 800; }
.lesson h2, .lab-h { font-weight: 800; }
.h-sec { font: 800 13px var(--f-body); color: var(--ink); letter-spacing: .08em; }
.score, .grade { font-family: var(--f-display); font-weight: 400; }
.score { color: var(--hl); text-shadow: 3px 3px 0 var(--outline); }
.back { font-weight: 800; }

/* section tabs: a pill switch */
.tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--card); border: 2.5px solid var(--outline); border-radius: 999px; box-shadow: 3px 3px 0 var(--outline); margin-bottom: 20px; max-width: 100%; }
.tabs button { border: 0; border-radius: 999px; margin: 0; padding: 7px 16px; font: 800 15px var(--f-body); color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--hl); color: var(--on-hl); border: 0; box-shadow: none; }
.tabs button[aria-selected="true"] small { color: var(--on-hl); opacity: .85; }
@media (max-width: 560px) {
  .tabs { display: flex; flex-wrap: nowrap; width: 100%; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 1 0 auto; padding: 7px 9px; font-size: 14px; white-space: nowrap; }
}
.subtabs button { border: 2px solid var(--outline); background: var(--card); font: 800 14px var(--f-body); box-shadow: 0 2px 0 var(--outline); }
.subtabs button[aria-pressed="true"] { background: var(--hl); color: var(--on-hl); border-color: var(--outline); }

/* progress dots */
.dots button { height: 10px; border: 2px solid var(--outline); background: var(--card); }
.dots button.seen { background: var(--pen-soft); opacity: 1; }
.dots button.ok { background: var(--mint); }
.dots button[aria-current="true"] { background: var(--butter); width: 32px; }
.p-dots button { border: 2px solid var(--outline); }

<script>
/* ===== Pure logic helpers: propositional logic, algebra checking, sets, number theory, Tarski world, graph stats ===== */
const LG = (function () {
  'use strict';

  /* ---------- propositional logic ---------- */
  const SYM = { and: '∧', or: '∨', xor: '⊕', imp: '→', iff: '↔' };
  const RULES = [
    [/^(<->|<=>|↔|⟷|⇔|iff\b)/i, 'iff'],
    [/^(->|=>|→|⟶|⇒|implies\b)/i, 'imp'],
    [/^(\/\\|∧|&&|&|\^|and\b)/i, 'and'],
    [/^(\\\/|∨|\|\||\||or\b)/i, 'or'],
    [/^(⊕|xor\b)/i, 'xor'],
    [/^(~|¬|!|not\b)/i, 'not'],
    [/^\(/, 'lp'], [/^\)/, 'rp']
  ];
  function lTok(src) {
    const s = String(src).replace(/−/g, '-');
    const out = []; let i = 0;
    outer: while (i < s.length) {
      if (/\s/.test(s[i])) { i++; continue; }
      const rest = s.slice(i);
      for (const [re, t] of RULES) { const m = rest.match(re); if (m) { out.push({ t }); i += m[0].length; continue outer; } }
      const c = s[i], nx = s[i + 1] || '';
      const prev = out[out.length - 1];
      if (c === 'v' && prev && (prev.t === 'var' || prev.t === 'const' || prev.t === 'rp') && !/[A-Za-z]/.test(nx)) { out.push({ t: 'or' }); i++; continue; }
      if (/[TF]/.test(c) && !/[A-Za-z]/.test(nx)) { out.push({ t: 'const', v: c === 'T' }); i++; continue; }
      if (/[a-z]/.test(c) && !/[A-Za-z]/.test(nx)) { out.push({ t: 'var', v: c }); i++; continue; }
      throw new Error('I can’t read “' + rest.slice(0, 8) + '”. Use single letters like p, q, r and the symbols ~ ∧ ∨ → ↔.');
    }
    return out;
  }
  function lParse(src) {
    const toks = lTok(src); let i = 0;
    if (!toks.length) throw new Error('Type an expression first.');
    const pk = () => toks[i];
    function iff() { let l = imp(); while (pk() && pk().t === 'iff') { i++; l = { op: 'iff', a: l, b: imp() }; } return l; }
    function imp() { const l = jun(); if (pk() && pk().t === 'imp') { i++; return { op: 'imp', a: l, b: imp() }; } return l; }
    function jun() {
      let l = un(), op = null;
      while (pk() && (pk().t === 'and' || pk().t === 'or' || pk().t === 'xor')) {
        const t = pk().t;
        if (op && op !== t) throw new Error('Mixing ' + SYM[op] + ' and ' + SYM[t] + ' without parentheses is ambiguous. Epp requires parentheses, like (p ∧ q) ∨ r.');
        op = t; i++; l = { op: t, a: l, b: un() };
      }
      return l;
    }
    function un() { if (pk() && pk().t === 'not') { i++; return { op: 'not', a: un() }; } return at(); }
    function at() {
      const k = pk(); if (!k) throw new Error('The expression ends too early.');
      i++;
      if (k.t === 'var') return { v: k.v };
      if (k.t === 'const') return { c: k.v };
      if (k.t === 'lp') { const e = iff(); if (!pk() || pk().t !== 'rp') throw new Error('Missing a closing parenthesis.'); i++; return e; }
      throw new Error('Something is missing before “' + (SYM[k.t] || ')') + '”.');
    }
    const e = iff();
    if (i < toks.length) throw new Error('Extra symbols after the end. Check your parentheses.');
    return e;
  }
  function lShow(n, top = true) {
    if ('v' in n) return n.v;
    if ('c' in n) return n.c ? 'T' : 'F';
    if (n.op === 'not') return '~' + lShow(n.a, false);
    const s = lShow(n.a, false) + ' ' + SYM[n.op] + ' ' + lShow(n.b, false);
    return top ? s : '(' + s + ')';
  }
  function lEval(n, env) {
    if ('v' in n) return !!env[n.v];
    if ('c' in n) return n.c;
    const a = lEval(n.a, env);
    if (n.op === 'not') return !a;
    const b = lEval(n.b, env);
    switch (n.op) { case 'and': return a && b; case 'or': return a || b; case 'xor': return a !== b; case 'imp': return !a || b; case 'iff': return a === b; }
  }
  function lVars(n, s = new Set()) { if ('v' in n) s.add(n.v); else if (n.a) { lVars(n.a, s); if (n.b) lVars(n.b, s); } return s; }
  const sortVars = set => [...set].sort();
  function lSubs(n, out = [], seen = new Set()) {
    if ('v' in n || 'c' in n) return out;
    lSubs(n.a, out, seen); if (n.b) lSubs(n.b, out, seen);
    const k = lShow(n); if (!seen.has(k)) { seen.add(k); out.push(n); }
    return out;
  }
  function lAssign(vars, r) { const env = {}; const n = vars.length; vars.forEach((v, j) => { env[v] = !((r >> (n - 1 - j)) & 1); }); return env; }
  function lEquiv(a, b) {
    const vars = sortVars(new Set([...lVars(a), ...lVars(b)]));
    for (let r = 0; r < (1 << vars.length); r++) { const e = lAssign(vars, r); if (lEval(a, e) !== lEval(b, e)) return { eq: false, row: r, env: e, vars }; }
    return { eq: true, vars };
  }
  function lClass(n) {
    const vars = sortVars(lVars(n)); let t = 0, f = 0;
    for (let r = 0; r < (1 << vars.length); r++) { lEval(n, lAssign(vars, r)) ? t++ : f++; }
    return f === 0 ? 'tautology' : t === 0 ? 'contradiction' : 'neither';
  }
  function lHas(n, ops) { if (!n || 'v' in n || 'c' in n) return false; return ops.includes(n.op) || lHas(n.a, ops) || lHas(n.b, ops); }
  function lNegAtomsOnly(n) { if ('v' in n || 'c' in n) return true; if (n.op === 'not') return 'v' in n.a; return lNegAtomsOnly(n.a) && lNegAtomsOnly(n.b); }

  /* ---------- algebra (integer polynomial expressions) ---------- */
  function aTok(src) {
    const s = String(src).replace(/−/g, '-').replace(/[·×∙⋅]/g, '*').replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4');
    const out = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; out.push({ t: 'num', v: parseFloat(s.slice(i, j)) }); i = j; continue; }
      if (/[a-zA-Z]/.test(c)) { out.push({ t: 'var', v: c }); i++; continue; }
      if ('+-*/^()'.includes(c)) { out.push({ t: c }); i++; continue; }
      if (c === '[') { out.push({ t: '(' }); i++; continue; }
      if (c === ']') { out.push({ t: ')' }); i++; continue; }
      throw new Error('I can’t read “' + c + '”.');
    }
    return out;
  }
  function aParse(src) {
    const T = aTok(src); let i = 0;
    if (!T.length) throw new Error('This blank is empty.');
    const pk = () => T[i];
    function expr() { let l = term(); while (pk() && (pk().t === '+' || pk().t === '-')) { const o = T[i++].t; l = { o, a: l, b: term() }; } return l; }
    function term() {
      let l = unary();
      for (;;) {
        const k = pk(); if (!k) break;
        if (k.t === '*' || k.t === '/') { i++; l = { o: k.t, a: l, b: unary() }; }
        else if (k.t === 'num' || k.t === 'var' || k.t === '(') { l = { o: '*', a: l, b: unary() }; }
        else break;
      }
      return l;
    }
    function unary() { if (pk() && pk().t === '-') { i++; return { o: 'neg', a: unary() }; } if (pk() && pk().t === '+') { i++; return unary(); } return pow(); }
    function pow() { const b = atom(); if (pk() && pk().t === '^') { i++; return { o: '^', a: b, b: unary() }; } return b; }
    function atom() {
      const k = T[i++]; if (!k) throw new Error('The expression ends too early.');
      if (k.t === 'num') return { n: k.v };
      if (k.t === 'var') return { x: k.v };
      if (k.t === '(') { const e = expr(); if (!pk() || pk().t !== ')') throw new Error('Missing a closing parenthesis.'); i++; return e; }
      throw new Error('Something is missing before “' + k.t + '”.');
    }
    const e = expr();
    if (i < T.length) throw new Error('Extra symbols at the end.');
    return e;
  }
  function aEval(n, env) {
    if ('n' in n) return n.n;
    if ('x' in n) { if (!(n.x in env)) throw new Error('Use only the letters ' + Object.keys(env).join(', ') + ' here (you used ' + n.x + ').'); return env[n.x]; }
    if (n.o === 'neg') return -aEval(n.a, env);
    const a = aEval(n.a, env), b = aEval(n.b, env);
    switch (n.o) { case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return a / b; case '^': return Math.pow(a, b); }
  }
  function aEquiv(input, target, vars) {
    let A, B;
    try { A = aParse(input); } catch (e) { return { ok: false, msg: e.message }; }
    B = aParse(target);
    const vs = [...vars];
    let seed = 7;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return (seed % 13) - 6; };
    try {
      for (let t = 0; t < 10; t++) {
        const env = {}; vs.forEach(v => env[v] = rnd() + (t % 3));
        const x = aEval(A, env), y = aEval(B, env);
        if (!isFinite(x) || Math.abs(x - y) > 1e-9 * Math.max(1, Math.abs(y))) return { ok: false, msg: 'Not equal yet. Expand carefully and compare.' };
      }
    } catch (e) { return { ok: false, msg: e.message }; }
    return { ok: true };
  }

  /* ---------- sets ---------- */
  function splitTop(s) { const parts = []; let d = 0, cur = ''; for (const ch of s) { if (ch === '{' || ch === '(') d++; if (ch === '}' || ch === ')') d--; if (ch === ',' && d === 0) { parts.push(cur); cur = ''; } else cur += ch; } if (cur.trim() !== '') parts.push(cur); return parts; }
  function normEl(x) { let t = x.trim().replace(/−/g, '-').replace(/\s+/g, ''); if (/^[-+]?\d+(\.\d+)?$/.test(t)) t = String(Number(t)); return t; }
  function parseSet(s) { let t = String(s).trim(); if (t.startsWith('{') && t.endsWith('}')) t = t.slice(1, -1); if (t.trim() === '') return []; return [...new Set(splitTop(t).map(normEl))]; }

  const tilt = [62, 38, 14, 0, 0, 0];

    s += '<text class="dm-t" x="' + (x + 9) + '" y="118" text-anchor="middle">P(' + (i + 1) + ')</text>';
  });
  return s + '<text class="dm-t" x="425" y="70" text-anchor="middle">…</text></svg>';
})();
